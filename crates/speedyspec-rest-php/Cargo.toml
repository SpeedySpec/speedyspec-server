[package]
name = "speedyspec-rest-php"
version = "0.1.4"
publish = false
description = "The REST transport's PHP adapter: WP_REST_Request and WP_REST_Response proxies over the Rust request and response, WP_Error mapping, the REST hooks through apply_filters, the PHP authenticator and Rest::bind."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "rest-api"
role = "php"

[dependencies]
indexmap = "2"
speedyspec-container.workspace = true
speedyspec-http-message = { path = "../speedyspec-http-message" }
speedyspec-operation = { path = "../speedyspec-operation" }
speedyspec-operation-contracts.workspace = true
speedyspec-operation-dispatch = { path = "../speedyspec-operation-dispatch" }
speedyspec-operation-php = { path = "../speedyspec-operation-php" }
speedyspec-php.workspace = true
speedyspec-php-ext.workspace = true
speedyspec-rest = { path = "../speedyspec-rest" }
speedyspec-rest-contracts.workspace = true
speedyspec-transport = { path = "../speedyspec-transport" }
speedyspec-transport-contracts.workspace = true

[dev-dependencies]
sha2 = "0.11"
ureq = "3"
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-hooks-php.workspace = true
speedyspec-compat.workspace = true
serde_json = "1"
speedyspec-container-php.workspace = true
speedyspec-hooks-memory.workspace = true
speedyspec-http.workspace = true

[[test]]
name = "hooks"
harness = false

[[test]]
name = "end_to_end"
harness = false

[[test]]
name = "service"
harness = false

[[test]]
name = "legacy"
harness = false

[[test]]
name = "caller"
harness = false

[[test]]
name = "wordpress"
harness = false
