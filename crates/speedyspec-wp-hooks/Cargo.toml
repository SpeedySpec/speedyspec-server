[package]
name = "speedyspec-wp-hooks"
version = "0.1.4"
description = "WordPress's Hook API (plugin.php and WP_Hook) as commands and queries over a hook store port."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The tests read the repository's compat/ and tests/php, so they run in this repository only.
exclude = ["tests/"]

[dependencies]
indexmap = "2"
speedyspec-container = { path = "../speedyspec-container", version = "0.1.4" }
speedyspec-cqrs = { path = "../speedyspec-cqrs", version = "0.1.4" }
speedyspec-hooks = { path = "../speedyspec-hooks", version = "0.1.4" }
