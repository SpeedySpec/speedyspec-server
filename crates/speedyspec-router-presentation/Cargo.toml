[package]
name = "speedyspec-router-presentation"
version = "0.1.1"
publish = false
description = "Routing as request stage 3 (eager mode): the routing middleware, redirect sources and WordPress's requested path."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
speedyspec-http = { path = "../speedyspec-http" }
speedyspec-http-message = { path = "../speedyspec-http-message" }
speedyspec-http-pipeline = { path = "../speedyspec-http-pipeline" }
speedyspec-routing = { path = "../speedyspec-routing" }
speedyspec-router = { path = "../speedyspec-router" }
speedyspec-wp-hooks = { path = "../speedyspec-wp-hooks" }
speedyspec-wp-rewrite = { path = "../speedyspec-wp-rewrite" }
regex = "1"

[dev-dependencies]
speedyspec-router-store-memory = { path = "../speedyspec-router-store-memory" }
speedyspec-wp-hooks-memory = { path = "../speedyspec-wp-hooks-memory" }
