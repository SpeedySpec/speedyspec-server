[package]
name = "speedyspec-wp-text-diff"
version = "0.1.0"
publish = false
description = "WordPress's wp_text_diff(): a port of Horde's native diff engine and WordPress's table renderer, with SIMD string work."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
foldhash = "0.2"
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "inline-more"] }
memchr = "2.8"
simdutf8 = "0.1.5"
speedyspec-wp-text-diff-contracts = { path = "../speedyspec-wp-text-diff-contracts" }

[dev-dependencies]
base64 = "0.22"
criterion = { version = "0.8", default-features = false }
proptest = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bench]]
name = "text_diff"
harness = false
