[package]
name = "speedyspec-wp-crypto-php"
version = "0.6.0"
publish = false
description = "WordPress's sodium functions (wp_fast_hash, wp_verify_fast_hash, wp_trusted_keys, verify_file_signature) as native PHP functions over Rust and libsodium."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "password"
role = "php"

[dependencies]
speedyspec-compat.workspace = true
speedyspec-hooks.workspace = true
speedyspec-php.workspace = true
speedyspec-wp-hooks.workspace = true
speedyspec-wp-crypto = { path = "../speedyspec-wp-crypto" }
speedyspec-wp-crypto-contracts.workspace = true
speedyspec-wp-crypto-sodium = { path = "../speedyspec-wp-crypto-sodium" }
speedyspec-wp-text-contracts.workspace = true
speedyspec-wp-text-escape = { path = "../speedyspec-wp-text-escape" }
base64 = "0.22"
speedyspec-wp-hooks-contracts.workspace = true

[dev-dependencies]
speedyspec-container.workspace = true
speedyspec-hooks-memory.workspace = true
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-hooks-php.workspace = true
serde_json = "1"
sha2 = "0.11"
ureq = "3"

[[test]]
name = "php"
harness = false

[[test]]
name = "wordpress"
harness = false
