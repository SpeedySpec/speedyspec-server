[package]
name = "speedyspec-wp-meta"
version = "0.2.0"
publish = false
description = "WordPress's metadata API in Rust: the meta.php use cases over their ports, protected keys, hook names, register_meta() and the registered-keys registry."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "meta"
role = "implementation"

[dependencies]
speedyspec-container.workspace = true
speedyspec-cqrs.workspace = true
speedyspec-wp-meta-contracts.workspace = true
speedyspec-php-serialize.workspace = true
speedyspec-wp-hooks-contracts.workspace = true
speedyspec-wp-object-cache-contracts.workspace = true
indexmap = "2"

[dev-dependencies]
serde_json = "1"
hex = "0.4"
