[package]
name = "speedyspec-php-port-macros"
version = "0.1.3"
description = "#[php_port]: generates a Rust port trait's PHP twin interface and its PHP adapter."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The tests read the repository's compat/ and tests/php, so they run in this repository only.
exclude = ["tests/"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
