[package]
name = "speedyspec-wp-kses"
version = "0.1.4"
publish = false
description = "WordPress's kses sanitizer in Rust: a fused single-pass wp_kses, the allowlists, safecss_filter_attr and the API."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "html"
role = "implementation"

[dependencies]
indexmap = "2"
memchr = "2"
serde_json = "1"
speedyspec-container.workspace = true
speedyspec-cqrs.workspace = true
speedyspec-hooks.workspace = true
speedyspec-wp-hooks.workspace = true
speedyspec-wp-html-syntax.workspace = true
speedyspec-wp-kses-contracts.workspace = true
speedyspec-wp-kses-lexical.workspace = true
stacker = "0.1"
speedyspec-wp-hooks-contracts.workspace = true

[dev-dependencies]
libc = "0.2"
proptest = "1"
sha2 = "0.10"
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-kses-security = { path = "../speedyspec-wp-kses-security" }
speedyspec-wp-kses-testkit = { path = "../speedyspec-wp-kses-testkit" }

[[bench]]
name = "kses"
harness = false
