[package]
name = "speedyspec-wp-db"
version = "0.2.0"
publish = false
description = "WordPress's wpdb in Rust: every method as a command or query over speedyspec's data layer, with its hooks."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "database"
role = "implementation"

[dependencies]
speedyspec-data.workspace = true
speedyspec-data-query = { path = "../speedyspec-data-query" }
speedyspec-hooks.workspace = true
speedyspec-wp-hooks.workspace = true
speedyspec-cqrs.workspace = true
speedyspec-container.workspace = true
indexmap = "2"
percent-encoding = "2"
regex = "1"
hmac = "0.12"
sha2 = "0.10"
speedyspec-wp-hooks-contracts.workspace = true
speedyspec-wp-db-contracts.workspace = true

[dev-dependencies]
speedyspec-wp-hooks-memory.workspace = true
speedyspec-data-mysql = { path = "../speedyspec-data-mysql" }
