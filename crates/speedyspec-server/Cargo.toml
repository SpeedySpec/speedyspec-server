[package]
name = "speedyspec-server"
version = "0.2.2"
publish = false
description = "The SpeedySpec web server."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Hooks for tests only: files next to the executable override its version or make a generation misbehave.
test-hooks = []

[[bin]]
name = "speedyspec-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
libc = "0.2"
speedyspec-server-handoff = { path = "../speedyspec-server-handoff" }
humantime = "2"
clap = { version = "4", features = ["derive"] }
semver = "1"
serde_json = "1"
speedyspec-server-app = { path = "../speedyspec-server-app" }
speedyspec-server-infra-fs = { path = "../speedyspec-server-infra-fs" }
speedyspec-server-infra-kubernetes = { path = "../speedyspec-server-infra-kubernetes" }
speedyspec-server-infra-http = { path = "../speedyspec-server-infra-http" }
speedyspec-server-infra-minisign = { path = "../speedyspec-server-infra-minisign" }
speedyspec-server-infra-access-dev = { path = "../speedyspec-server-infra-access-dev" }
speedyspec-server-presentation = { path = "../speedyspec-server-presentation" }
speedyspec-server-static = { path = "../speedyspec-server-static" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
ipnet = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
speedyspec-server-domain = { path = "../speedyspec-server-domain" }
speedyspec-runtime-contract = { path = "../speedyspec-runtime-contract" }
speedyspec-server-gate = { path = "../speedyspec-server-gate" }
thiserror = "2"
toml = "0.9"
salvo = { version = "1.2", default-features = false, features = ["server", "server-handle", "http1", "http2", "http2-cleartext", "quinn", "rustls", "ring"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
rustix = { version = "1", features = ["net", "fs", "process", "stdio", "system"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }

speedyspec-fastcgi = { path = "../speedyspec-fastcgi" }
http-body-util = "0.1"
http = "1"

[dev-dependencies]
speedyspec-server-handoff = { path = "../speedyspec-server-handoff" }
libc = "0.2"
minisign = "0.7"
sha2 = "0.10"
speedyspec-server-infra-memory = { path = "../speedyspec-server-infra-memory" }
serde_json = "1"
bytes = "1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "blocking"] }
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile = "3"
