[package]
name = "speedyspec-wp-kses-testkit"
version = "0.5.0"
description = "Test support for the kses port: a PHP oracle running WordPress's own kses.php, and the test corpora."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.speedyspec]
seam = "html"
role = "test"

[dependencies]
base64 = "0.22"
flate2 = "1"
indexmap = "2"
memchr = "2"
proptest = "1.12.0"
serde_json = "1"
sha2 = "0.10"
speedyspec-wp-kses-contracts.workspace = true
tar = "0.4"
tempfile = "3"
ureq = "3"

[dev-dependencies]
speedyspec-wp-html-syntax.workspace = true
speedyspec-wp-kses-lexical.workspace = true
