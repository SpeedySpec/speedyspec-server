[package]
name = "speedyspec-transport"
version = "0.2.0"
publish = false
description = "The unified operation API's transport layer: bindings, the transport registry and exposure, stage middleware for hooks, and the serve pipeline every transport runs."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "operation"
role = "implementation"

[dependencies]
speedyspec-operation = { path = "../speedyspec-operation" }
speedyspec-operation-contracts.workspace = true
speedyspec-operation-dispatch = { path = "../speedyspec-operation-dispatch" }
speedyspec-transport-contracts.workspace = true

[dev-dependencies]
speedyspec-container.workspace = true
