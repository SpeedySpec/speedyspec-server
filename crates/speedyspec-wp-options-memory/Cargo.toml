[package]
name = "speedyspec-wp-options-memory"
version = "0.1.0"
description = "An in-memory option repository, for tests and for callers with no database."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
indexmap = "2"
speedyspec-wp-options = { path = "../speedyspec-wp-options" }

[dev-dependencies]
speedyspec-wp-options = { path = "../speedyspec-wp-options", features = ["conformance"] }
