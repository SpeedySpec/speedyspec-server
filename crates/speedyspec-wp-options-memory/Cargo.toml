[package]
name = "speedyspec-wp-options-memory"
version = "0.1.0"
description = "An in-memory option repository, for tests and for callers with no database."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
indexmap = "2"
speedyspec-data = { path = "../speedyspec-data" }
speedyspec-wp-options = { path = "../speedyspec-wp-options" }

[dev-dependencies]
speedyspec-wp-hooks = { path = "../speedyspec-wp-hooks" }
speedyspec-wp-hooks-memory = { path = "../speedyspec-wp-hooks-memory" }
speedyspec-wp-object-cache = { path = "../speedyspec-wp-object-cache" }
speedyspec-wp-options = { path = "../speedyspec-wp-options", features = ["conformance"] }
