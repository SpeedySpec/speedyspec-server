[package]
name = "speedyspec-wp-options-memory"
version = "0.2.0"
publish = false
description = "An in-memory option repository, for tests and for callers with no database."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "options"
role = "adapter"

[dependencies]
indexmap = "2"
speedyspec-data.workspace = true
speedyspec-wp-options = { path = "../speedyspec-wp-options" }
speedyspec-wp-hooks-contracts.workspace = true

[dev-dependencies]
speedyspec-cache.workspace = true
speedyspec-cache-memory = { path = "../speedyspec-cache-memory" }
speedyspec-wp-hooks.workspace = true
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-object-cache = { path = "../speedyspec-wp-object-cache" }
speedyspec-wp-options = { path = "../speedyspec-wp-options", features = ["conformance"] }
