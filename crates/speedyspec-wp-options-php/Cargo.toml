[package]
name = "speedyspec-wp-options-php"
version = "0.3.0"
publish = false
description = "WordPress's option functions (get_option and the rest) as native PHP functions over the Rust options API."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "options"
role = "php"

[dependencies]
speedyspec-data.workspace = true
speedyspec-compat.workspace = true
speedyspec-container.workspace = true
speedyspec-cqrs.workspace = true
speedyspec-php.workspace = true
speedyspec-php-ext.workspace = true
speedyspec-php-serialize.workspace = true
speedyspec-wp-db = { path = "../speedyspec-wp-db" }
speedyspec-wp-hooks.workspace = true
speedyspec-wp-object-cache = { path = "../speedyspec-wp-object-cache" }
speedyspec-wp-options = { path = "../speedyspec-wp-options" }
speedyspec-wp-options-sql = { path = "../speedyspec-wp-options-sql" }
speedyspec-wp-hooks-php.workspace = true
indexmap = "2"
speedyspec-wp-hooks-contracts.workspace = true

[dev-dependencies]
speedyspec-cache.workspace = true
speedyspec-cache-routing = { path = "../speedyspec-cache-routing" }
speedyspec-container-php.workspace = true
speedyspec-data-file = { path = "../speedyspec-data-file" }
speedyspec-data-mysql = { path = "../speedyspec-data-mysql" }
speedyspec-data-query = { path = "../speedyspec-data-query" }
speedyspec-hooks-memory.workspace = true
speedyspec-wp-db-php = { path = "../speedyspec-wp-db-php" }
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-object-cache-php = { path = "../speedyspec-wp-object-cache-php" }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = "3"

[[test]]
name = "php"
harness = false

[[test]]
name = "compat"
harness = false

[[test]]
name = "wordpress"
harness = false
