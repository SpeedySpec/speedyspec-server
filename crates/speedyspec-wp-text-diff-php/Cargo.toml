[package]
name = "speedyspec-wp-text-diff-php"
version = "0.3.0"
publish = false
description = "WordPress's wp_text_diff() as a native PHP function over the Rust text diff."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "text-diff"
role = "php"

[dependencies]
speedyspec-container.workspace = true
speedyspec-container-php.workspace = true
speedyspec-php.workspace = true
speedyspec-php-ext.workspace = true
speedyspec-wp-hooks.workspace = true
speedyspec-wp-text-diff.workspace = true
speedyspec-wp-text-diff-contracts.workspace = true
speedyspec-wp-hooks-contracts.workspace = true

[dev-dependencies]
base64 = "0.22"
criterion = { version = "0.8", default-features = false }
speedyspec-compat.workspace = true
speedyspec-hooks-memory.workspace = true
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-hooks-php.workspace = true
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
ureq = "3"

[[test]]
name = "php"
harness = false

[[test]]
name = "wordpress"
harness = false

[[bench]]
name = "text_diff"
harness = false
