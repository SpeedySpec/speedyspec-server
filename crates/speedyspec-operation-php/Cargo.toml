[package]
name = "speedyspec-operation-php"
version = "0.1.2"
publish = false
description = "The unified operation API from PHP: the S, Type and Operation builders, PHP handlers and permission callbacks, value-object mappers, and per-site registries."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "operation"
role = "php"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
indexmap = "2"
serde_json = "1"
speedyspec-container.workspace = true
speedyspec-container-php.workspace = true
speedyspec-operation = { path = "../speedyspec-operation" }
speedyspec-operation-contracts.workspace = true
speedyspec-operation-dispatch = { path = "../speedyspec-operation-dispatch" }
speedyspec-php.workspace = true
speedyspec-php-ext.workspace = true

[dev-dependencies]
speedyspec-hooks-memory.workspace = true

[[test]]
name = "registration"
harness = false

[[test]]
name = "identity"
harness = false

[[test]]
name = "dispatch"
harness = false

[[test]]
name = "lifetime"
harness = false
