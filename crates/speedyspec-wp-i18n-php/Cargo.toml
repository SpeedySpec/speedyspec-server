[package]
name = "speedyspec-wp-i18n-php"
version = "0.1.8"
publish = false
description = "WordPress's translation functions in PHP over the Rust translations port: the native __() family, the translation controller and file classes, and a release prepared for them."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "i18n"
role = "php"

[dependencies]
speedyspec-compat.workspace = true
foldhash = "0.2"
speedyspec-container.workspace = true
speedyspec-hooks.workspace = true
speedyspec-php.workspace = true
speedyspec-wp-hooks.workspace = true
speedyspec-wp-i18n = { path = "../speedyspec-wp-i18n" }
speedyspec-wp-i18n-contracts.workspace = true
speedyspec-wp-i18n-files = { path = "../speedyspec-wp-i18n-files" }
speedyspec-wp-i18n-memory = { path = "../speedyspec-wp-i18n-memory" }
speedyspec-wp-hooks-php.workspace = true
speedyspec-wp-utf8-php = { path = "../speedyspec-wp-utf8-php" }
speedyspec-wp-hooks-contracts.workspace = true

[dev-dependencies]
speedyspec-hooks-memory.workspace = true
speedyspec-php-ext.workspace = true
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-utf8-php = { path = "../speedyspec-wp-utf8-php" }
serde_json = "1"
sha2 = "0.10"
ureq = "3"

[[bench]]
name = "request"
harness = false

[[test]]
name = "php"
harness = false

[[test]]
name = "wordpress"
harness = false
