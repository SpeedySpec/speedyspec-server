[package]
name = "speedyspec-wp-media-ffmpeg"
version = "0.4.0"
description = "The media reader over FFmpeg: a C shim over libavformat, bounded and offline, mapped to MediaInfo."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.speedyspec]
seam = "media"
role = "adapter"

[dependencies]
libc = "0.2"
speedyspec-ffmpeg-sys = { path = "../speedyspec-ffmpeg-sys" }
speedyspec-wp-media-contracts.workspace = true

[build-dependencies]
cc = "1"

[dev-dependencies]
speedyspec-wp-media-testkit = { path = "../speedyspec-wp-media-testkit" }
tempfile = "3"
