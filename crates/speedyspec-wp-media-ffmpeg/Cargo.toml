[package]
name = "speedyspec-wp-media-ffmpeg"
version = "0.2.0"
description = "The media reader over FFmpeg: a C shim over libavformat, bounded and offline, mapped to MediaInfo."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
libc = "0.2"
speedyspec-ffmpeg-sys = { path = "../speedyspec-ffmpeg-sys" }
speedyspec-wp-media-contracts = { path = "../speedyspec-wp-media-contracts" }

[build-dependencies]
cc = "1"

[dev-dependencies]
speedyspec-wp-media-testkit = { path = "../speedyspec-wp-media-testkit" }
tempfile = "3"
