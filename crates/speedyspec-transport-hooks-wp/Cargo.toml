[package]
name = "speedyspec-transport-hooks-wp"
version = "0.1.4"
publish = false
description = "Transport hooks over WordPress's Hook API: neutral values to and from hook values, filters and actions through speedyspec-wp-hooks."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "operation"
role = "adapter"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
speedyspec-operation-contracts.workspace = true
speedyspec-transport-contracts.workspace = true
speedyspec-wp-hooks.workspace = true
speedyspec-wp-hooks-contracts.workspace = true

[dev-dependencies]
speedyspec-wp-hooks-memory.workspace = true
