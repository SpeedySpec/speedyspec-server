[package]
name = "speedyspec-wp-i18n-tests"
version = "0.1.5"
publish = false
description = "Integration tests of speedyspec-wp-i18n with its file and memory adapters. A crate of its own so no crate has a dev-dependency on one that depends on it (release-please's cargo-workspace plugin refuses such cycles)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "i18n"
role = "test"

[dev-dependencies]
base64 = "0.22"
serde_json = "1"
speedyspec-hooks.workspace = true
speedyspec-wp-hooks.workspace = true
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-i18n = { path = "../speedyspec-wp-i18n" }
speedyspec-wp-i18n-contracts.workspace = true
speedyspec-wp-i18n-files = { path = "../speedyspec-wp-i18n-files" }
speedyspec-wp-i18n-memory = { path = "../speedyspec-wp-i18n-memory" }
tempfile = "3"
speedyspec-wp-hooks-contracts.workspace = true
