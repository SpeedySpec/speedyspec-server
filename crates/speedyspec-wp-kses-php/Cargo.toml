[package]
name = "speedyspec-wp-kses-php"
version = "0.1.7"
publish = false
description = "WordPress's kses functions (wp_kses and the rest) as native PHP functions over the Rust kses API."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "html"
role = "php"

[dependencies]
indexmap = "2"
speedyspec-compat.workspace = true
speedyspec-container.workspace = true
speedyspec-cqrs.workspace = true
speedyspec-php.workspace = true
speedyspec-php-ext.workspace = true
speedyspec-wp-hooks.workspace = true
speedyspec-wp-hooks-php.workspace = true
speedyspec-wp-kses = { path = "../speedyspec-wp-kses" }
speedyspec-wp-kses-contracts.workspace = true
speedyspec-wp-kses-lexical.workspace = true
speedyspec-wp-hooks-contracts.workspace = true

[dev-dependencies]
speedyspec-container-php.workspace = true
speedyspec-hooks-memory.workspace = true
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-kses-testkit = { path = "../speedyspec-wp-kses-testkit" }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
ureq = "3"

[[test]]
name = "php"
harness = false

[[test]]
name = "wordpress"
harness = false

[[test]]
name = "compat"
harness = false

[[test]]
name = "bench_php"
harness = false
