[package]
name = "speedyspec-wp-kses-php"
version = "0.1.3"
publish = false
description = "WordPress's kses functions (wp_kses and the rest) as native PHP functions over the Rust kses API."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
indexmap = "2"
speedyspec-compat = { path = "../speedyspec-compat" }
speedyspec-container = { path = "../speedyspec-container" }
speedyspec-cqrs = { path = "../speedyspec-cqrs" }
speedyspec-php = { path = "../speedyspec-php" }
speedyspec-php-ext = { path = "../speedyspec-php-ext" }
speedyspec-wp-hooks = { path = "../speedyspec-wp-hooks" }
speedyspec-wp-hooks-php = { path = "../speedyspec-wp-hooks-php" }
speedyspec-wp-kses = { path = "../speedyspec-wp-kses" }
speedyspec-wp-kses-contracts = { path = "../speedyspec-wp-kses-contracts" }
speedyspec-wp-kses-lexical = { path = "../speedyspec-wp-kses-lexical" }

[dev-dependencies]
speedyspec-container-php = { path = "../speedyspec-container-php" }
speedyspec-hooks-memory = { path = "../speedyspec-hooks-memory" }
speedyspec-wp-hooks-memory = { path = "../speedyspec-wp-hooks-memory" }
speedyspec-wp-kses-testkit = { path = "../speedyspec-wp-kses-testkit" }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
ureq = "3"

[[test]]
name = "php"
harness = false

[[test]]
name = "wordpress"
harness = false

[[test]]
name = "compat"
harness = false

[[test]]
name = "bench_php"
harness = false
