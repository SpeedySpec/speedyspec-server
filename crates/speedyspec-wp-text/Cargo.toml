[package]
name = "speedyspec-wp-text"
version = "0.1.9"
publish = false
description = "WordPress's content filters and sanitizers (wptexturize, wpautop and the rest) in Rust, byte for byte, behind a TextApi facade that fires their filters."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "text"
role = "implementation"

[dependencies]
speedyspec-container.workspace = true
speedyspec-cqrs.workspace = true
aho-corasick = "1"
memchr = "2.8"
pcre2 = "0.2"
speedyspec-hooks.workspace = true
speedyspec-wp-hooks.workspace = true
speedyspec-wp-html-split.workspace = true
speedyspec-wp-kses = { path = "../speedyspec-wp-kses" }
speedyspec-wp-kses-contracts.workspace = true
speedyspec-wp-kses-lexical.workspace = true
speedyspec-wp-shortcode-contracts.workspace = true
speedyspec-wp-text-contracts.workspace = true
speedyspec-wp-text-escape = { path = "../speedyspec-wp-text-escape" }
speedyspec-wp-utf8.workspace = true
unicode-normalization = "0.1"
speedyspec-wp-hooks-contracts.workspace = true

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
libc = "0.2"
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-text-memory = { path = "../speedyspec-wp-text-memory" }
speedyspec-wp-text-corpus = { path = "../speedyspec-wp-text-corpus", features = ["values"] }

[[bench]]
name = "content"
harness = false

[[bench]]
name = "sanitize"
harness = false
