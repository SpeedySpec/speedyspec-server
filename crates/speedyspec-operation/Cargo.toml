[package]
name = "speedyspec-operation"
version = "0.1.0"
description = "The unified operation API's specification: the S schema builder, the validator, Type and Operation builders, the registries with their registration checks, and document export."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
indexmap = "2"
regex = "1"
serde_json = "1"
speedyspec-operation-contracts = { path = "../speedyspec-operation-contracts" }
thiserror = "2"
