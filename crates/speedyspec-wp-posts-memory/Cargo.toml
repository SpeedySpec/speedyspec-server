[package]
name = "speedyspec-wp-posts-memory"
version = "0.2.0"
publish = false
description = "An in-memory post repository, for tests and for callers with no database."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "query"
role = "adapter"

[dependencies]
speedyspec-wp-posts-contracts.workspace = true
speedyspec-php-serialize.workspace = true

[dev-dependencies]
speedyspec-wp-posts-contracts = { workspace = true, features = ["conformance"] }
