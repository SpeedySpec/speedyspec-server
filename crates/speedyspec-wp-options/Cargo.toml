[package]
name = "speedyspec-wp-options"
version = "0.3.1"
publish = false
description = "WordPress's options API (get_option, update_option and the rest) in Rust: the entity, its ports and the API."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "options"
role = "implementation"

[dependencies]
speedyspec-container.workspace = true
speedyspec-cqrs.workspace = true
indexmap = "2"
speedyspec-data.workspace = true
speedyspec-data-uow = { path = "../speedyspec-data-uow" }
speedyspec-php-serialize.workspace = true
tracing = "0.1"
speedyspec-wp-hooks-contracts.workspace = true
speedyspec-wp-object-cache-contracts.workspace = true
speedyspec-wp-options-contracts.workspace = true

[dev-dependencies]
speedyspec-wp-hooks.workspace = true
speedyspec-wp-object-cache = { path = "../speedyspec-wp-object-cache" }
speedyspec-wp-hooks-memory.workspace = true

[features]
# The option repository suite every repository must pass.
conformance = []
