[package]
name = "speedyspec-operation-dispatch"
version = "0.1.4"
publish = false
description = "Dispatch for the unified operation API: handlers bound in the service container by operation name, middleware (permission first), and calls by name with neutral values."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "operation"
role = "implementation"

[dependencies]
speedyspec-container = { path = "../speedyspec-container" }
speedyspec-operation = { path = "../speedyspec-operation" }
speedyspec-operation-contracts = { path = "../speedyspec-operation-contracts" }
