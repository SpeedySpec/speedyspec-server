[package]
name = "speedyspec-wp-db-php"
version = "0.4.0"
publish = false
description = "WordPress's wpdb class and the $wpdb global in PHP, native over the Rust wpdb port."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "database"
role = "php"

[dependencies]
indexmap = "2"
sha2 = "0.11"
speedyspec-container.workspace = true
speedyspec-cqrs.workspace = true
speedyspec-data.workspace = true
speedyspec-data-query = { path = "../speedyspec-data-query" }
speedyspec-php.workspace = true
speedyspec-php-ext.workspace = true
speedyspec-wp-db = { path = "../speedyspec-wp-db" }
speedyspec-wp-hooks.workspace = true
speedyspec-wp-db-contracts.workspace = true

[dev-dependencies]
speedyspec-container-php.workspace = true
speedyspec-hooks-memory.workspace = true
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-hooks-php.workspace = true
speedyspec-compat.workspace = true
speedyspec-data-mysql = { path = "../speedyspec-data-mysql" }
speedyspec-data-sqlite = { path = "../speedyspec-data-sqlite" }
speedyspec-data-postgres = { path = "../speedyspec-data-postgres" }
postgres = "0.19"
tempfile = "3"
serde_json = "1"

[[test]]
name = "php"
harness = false

[[test]]
name = "replay"
harness = false

[[test]]
name = "replay_postgres"
harness = false

[[test]]
name = "replay_sqlite"
harness = false

[[test]]
name = "wordpress"
harness = false
