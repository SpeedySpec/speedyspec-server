[package]
name = "speedyspec-abilities-php"
version = "0.1.0"
publish = false
description = "The Abilities transport's PHP adapter: WordPress's ability hooks, Abilities::publish, and the WP_Ability shim that runs every ability through the Rust Abilities server."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
indexmap = "2"
serde_json = "1"
speedyspec-abilities = { path = "../speedyspec-abilities" }
speedyspec-abilities-contracts = { path = "../speedyspec-abilities-contracts" }
speedyspec-container = { path = "../speedyspec-container" }
speedyspec-operation = { path = "../speedyspec-operation" }
speedyspec-operation-contracts = { path = "../speedyspec-operation-contracts" }
speedyspec-operation-dispatch = { path = "../speedyspec-operation-dispatch" }
speedyspec-operation-php = { path = "../speedyspec-operation-php" }
speedyspec-php = { path = "../speedyspec-php" }
speedyspec-php-ext = { path = "../speedyspec-php-ext" }
speedyspec-transport = { path = "../speedyspec-transport" }
speedyspec-transport-contracts = { path = "../speedyspec-transport-contracts" }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
ureq = "3"
speedyspec-wp-hooks-memory = { path = "../speedyspec-wp-hooks-memory" }
speedyspec-wp-hooks-php = { path = "../speedyspec-wp-hooks-php" }
speedyspec-compat = { path = "../speedyspec-compat" }
speedyspec-container-php = { path = "../speedyspec-container-php" }
speedyspec-hooks-memory = { path = "../speedyspec-hooks-memory" }

[[test]]
name = "hooks"
harness = false

[[test]]
name = "facade"
harness = false

[[test]]
name = "legacy"
harness = false

[[test]]
name = "operations"
harness = false

[[test]]
name = "wordpress"
harness = false
