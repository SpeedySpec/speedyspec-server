[package]
name = "speedyspec-abilities-php"
version = "0.1.1"
publish = false
description = "The Abilities transport's PHP adapter: WordPress's ability hooks, Abilities::publish, and the WP_Ability shim that runs every ability through the Rust Abilities server."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "ability"
role = "php"

[dependencies]
indexmap = "2"
serde_json = "1"
speedyspec-abilities = { path = "../speedyspec-abilities" }
speedyspec-abilities-contracts.workspace = true
speedyspec-container.workspace = true
speedyspec-operation = { path = "../speedyspec-operation" }
speedyspec-operation-contracts.workspace = true
speedyspec-operation-dispatch = { path = "../speedyspec-operation-dispatch" }
speedyspec-operation-php = { path = "../speedyspec-operation-php" }
speedyspec-php.workspace = true
speedyspec-php-ext.workspace = true
speedyspec-transport = { path = "../speedyspec-transport" }
speedyspec-transport-contracts.workspace = true

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
ureq = "3"
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-hooks-php.workspace = true
speedyspec-compat.workspace = true
speedyspec-container-php.workspace = true
speedyspec-hooks-memory.workspace = true

[[test]]
name = "hooks"
harness = false

[[test]]
name = "facade"
harness = false

[[test]]
name = "legacy"
harness = false

[[test]]
name = "operations"
harness = false

[[test]]
name = "wordpress"
harness = false
