[package]
name = "speedyspec-data-file"
version = "0.3.0"
publish = false
description = "The file Direct Store: a directory of files, written atomically, with exclusive locks."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "data"
role = "adapter"

[dependencies]
libc = "0.2"
speedyspec-data.workspace = true

[dev-dependencies]
libc = "0.2"
speedyspec-data-conformance = { path = "../speedyspec-data-conformance" }
speedyspec-data-query = { path = "../speedyspec-data-query" }
tempfile = "3"
