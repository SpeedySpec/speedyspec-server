[package]
name = "speedyspec-wp-rewrite"
version = "0.1.6"
publish = false
description = "WordPress's Rewrite API (WP_Rewrite, rewrite.php) in Rust over the router's WordPress rule sets."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "route"
role = "implementation"

[dependencies]
speedyspec-routing.workspace = true
speedyspec-router = { path = "../speedyspec-router" }
speedyspec-wp-hooks.workspace = true
speedyspec-wp-options-contracts.workspace = true
speedyspec-http.workspace = true
speedyspec-container.workspace = true
speedyspec-cqrs.workspace = true
regex = "1"
speedyspec-wp-hooks-contracts.workspace = true

[dev-dependencies]
serde_json = "1"
speedyspec-wp-hooks-memory.workspace = true
speedyspec-router-store-memory = { path = "../speedyspec-router-store-memory" }
