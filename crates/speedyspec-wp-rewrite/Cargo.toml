[package]
name = "speedyspec-wp-rewrite"
version = "0.1.0"
description = "WordPress's Rewrite API (WP_Rewrite, rewrite.php) in Rust over the router's WordPress rule sets."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
speedyspec-routing = { path = "../speedyspec-routing" }
speedyspec-router = { path = "../speedyspec-router" }
speedyspec-wp-hooks = { path = "../speedyspec-wp-hooks" }
speedyspec-wp-options = { path = "../speedyspec-wp-options" }
speedyspec-http = { path = "../speedyspec-http" }
speedyspec-container = { path = "../speedyspec-container" }
speedyspec-cqrs = { path = "../speedyspec-cqrs" }
regex = "1"

[dev-dependencies]
serde_json = "1"
speedyspec-wp-hooks-memory = { path = "../speedyspec-wp-hooks-memory" }
speedyspec-router-store-memory = { path = "../speedyspec-router-store-memory" }
