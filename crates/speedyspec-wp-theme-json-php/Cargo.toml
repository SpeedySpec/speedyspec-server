[package]
name = "speedyspec-wp-theme-json-php"
version = "0.1.5"
publish = false
description = "WordPress's theme.json classes in PHP, thin wrappers over the Rust theme.json engine."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "theme"
role = "php"

[dependencies]
speedyspec-container.workspace = true
speedyspec-hooks.workspace = true
speedyspec-php.workspace = true
speedyspec-compat.workspace = true
speedyspec-wp-hooks.workspace = true
speedyspec-wp-theme-json = { path = "../speedyspec-wp-theme-json" }
speedyspec-wp-theme-json-contracts.workspace = true
speedyspec-cqrs.workspace = true
speedyspec-wp-kses-contracts.workspace = true

[dev-dependencies]
serde_json = "1"
sha2 = "0.11"
speedyspec-container-php.workspace = true
speedyspec-php-ext.workspace = true
ureq = "3"
speedyspec-hooks-memory.workspace = true
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-hooks-php.workspace = true

[[test]]
name = "php"
harness = false

[[test]]
name = "compat"
harness = false

[[test]]
name = "wordpress"
harness = false
