[package]
name = "speedyspec-cache-file"
version = "0.3.0"
publish = false
description = "A Caching Store in files, through the file Direct Store: one hashed file per entry, a directory per group."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "cache"
role = "adapter"

[dependencies]
sha2 = "0.11"
speedyspec-cache.workspace = true
speedyspec-data.workspace = true
speedyspec-data-file = { path = "../speedyspec-data-file" }

[dev-dependencies]
speedyspec-cache-conformance = { path = "../speedyspec-cache-conformance" }
speedyspec-data-memory = { path = "../speedyspec-data-memory" }
tempfile = "3"
