[package]
name = "speedyspec-firewall-infra-cache"
version = "0.1.2"
publish = false
description = "The firewall's counters and bans on the Caching Store: memory, database, Valkey, ReDB or file."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "firewall"
role = "adapter"

[dependencies]
speedyspec-cache.workspace = true
speedyspec-firewall = { path = "../speedyspec-firewall" }

[dev-dependencies]
speedyspec-cache-file = { path = "../speedyspec-cache-file" }
speedyspec-cache-kv = { path = "../speedyspec-cache-kv" }
speedyspec-cache-memory = { path = "../speedyspec-cache-memory" }
speedyspec-data-memory = { path = "../speedyspec-data-memory" }
speedyspec-data-valkey = { path = "../speedyspec-data-valkey" }
speedyspec-data.workspace = true
speedyspec-data-file = { path = "../speedyspec-data-file" }
tempfile = "3"
