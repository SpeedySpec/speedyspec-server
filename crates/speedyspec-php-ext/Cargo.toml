[package]
name = "speedyspec-php-ext"
version = "0.1.4"
description = "The speedyspec_wordpress PHP extension's shared parts: PHP twins of Rust ports, their PHP adapters, value conversion and the boundary counter."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The tests read the repository's compat/ and tests/php, so they run in this repository only.
exclude = ["tests/"]

[dependencies]
speedyspec-hooks = { path = "../speedyspec-hooks", version = "0.1.2" }
speedyspec-php = { path = "../speedyspec-php", version = "0.5.0" }
speedyspec-php-port-macros = { path = "../speedyspec-php-port-macros", version = "0.1.2" }
inventory = "0.3"

[dev-dependencies]
speedyspec-hooks-memory = { path = "../speedyspec-hooks-memory" }

[[test]]
name = "ext"
harness = false
