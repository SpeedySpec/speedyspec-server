[package]
name = "speedyspec-php-ext"
version = "0.1.1"
description = "The speedyspec_wordpress PHP extension's shared parts: PHP twins of Rust ports, their PHP adapters, value conversion and the boundary counter."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
speedyspec-hooks = { path = "../speedyspec-hooks" }
speedyspec-php = { path = "../speedyspec-php" }
speedyspec-php-port-macros = { path = "../speedyspec-php-port-macros" }
inventory = "0.3"

[dev-dependencies]
speedyspec-hooks-memory = { path = "../speedyspec-hooks-memory" }

[[test]]
name = "ext"
harness = false
