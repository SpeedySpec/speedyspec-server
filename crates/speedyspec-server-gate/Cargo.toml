[package]
name = "speedyspec-server-gate"
version = "0.1.5"
publish = false
description = "The admin gate, health and maintenance: framework-neutral, over ports the server's adapters implement."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
speedyspec-server-domain = { path = "../speedyspec-server-domain" }
http = "1"
regex = "1"
httpdate = "1"
sha2 = "0.10"
semver = "1"
tokio = { version = "1", features = ["time", "sync", "rt", "macros"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
