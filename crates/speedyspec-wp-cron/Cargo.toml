[package]
name = "speedyspec-wp-cron"
version = "0.5.0"
publish = false
description = "WordPress's cron scheduling API in Rust: the commands and queries of cron.php over a CronStore, each write a compare-and-swap."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "cron"
role = "implementation"

[dependencies]
speedyspec-wp-cron-contracts.workspace = true
speedyspec-wp-hooks-contracts.workspace = true
speedyspec-php-serialize.workspace = true
md5 = { package = "md-5", version = "0.11.0" }

[dev-dependencies]
speedyspec-wp-hooks.workspace = true
speedyspec-wp-hooks-memory.workspace = true
