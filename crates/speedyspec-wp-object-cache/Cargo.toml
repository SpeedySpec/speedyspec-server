[package]
name = "speedyspec-wp-object-cache"
version = "0.2.0"
publish = false
description = "WordPress's object cache (WP_Object_Cache and wp_cache_*) in Rust, with an optional persistent second level."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "object-cache"
role = "implementation"

[dependencies]
indexmap = "2"
speedyspec-cache = { path = "../speedyspec-cache" }
speedyspec-container = { path = "../speedyspec-container" }
speedyspec-cqrs = { path = "../speedyspec-cqrs" }
speedyspec-hooks = { path = "../speedyspec-hooks" }
speedyspec-php-serialize = { path = "../speedyspec-php-serialize" }
speedyspec-wp-object-cache-contracts = { path = "../speedyspec-wp-object-cache-contracts" }

[dev-dependencies]
speedyspec-cache-memory = { path = "../speedyspec-cache-memory" }
