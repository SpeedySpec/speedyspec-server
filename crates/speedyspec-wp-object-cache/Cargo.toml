[package]
name = "speedyspec-wp-object-cache"
version = "0.2.0"
publish = false
description = "WordPress's object cache (WP_Object_Cache and wp_cache_*) in Rust, with an optional persistent second level."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "object-cache"
role = "implementation"

[dependencies]
indexmap = "2"
speedyspec-cache.workspace = true
speedyspec-container.workspace = true
speedyspec-cqrs.workspace = true
speedyspec-hooks.workspace = true
speedyspec-php-serialize.workspace = true
speedyspec-wp-object-cache-contracts.workspace = true

[dev-dependencies]
speedyspec-cache-memory = { path = "../speedyspec-cache-memory" }
