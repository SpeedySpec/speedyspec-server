[package]
name = "speedyspec-wp-utf8-php"
version = "0.2.0"
publish = false
description = "WordPress's UTF-8 functions (utf8.php, compat-utf8.php and compat.php's UTF-8 helpers) as native PHP functions over speedyspec-wp-utf8."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "text"
role = "php"

[dependencies]
speedyspec-compat.workspace = true
speedyspec-php.workspace = true
speedyspec-hooks.workspace = true
speedyspec-wp-utf8.workspace = true

[dev-dependencies]
speedyspec-container.workspace = true
speedyspec-hooks-memory.workspace = true
speedyspec-php-ext.workspace = true
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-hooks-php.workspace = true
serde_json = "1"
sha2 = "0.11"
ureq = "3"
speedyspec-wp-hooks-contracts.workspace = true

[[test]]
name = "php"
harness = false

[[test]]
name = "wordpress"
harness = false
