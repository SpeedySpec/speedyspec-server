[package]
name = "speedyspec-wp-posts-tests"
version = "0.1.0"
publish = false
description = "Integration tests of speedyspec-wp-posts's filtered use cases with the Rust hook API, the Rust escaping and the in-memory post repository, replaying the recorded compat/posts-read scenarios. A crate of its own so speedyspec-wp-posts depends on contracts only."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "query"
role = "test"

[dev-dependencies]
speedyspec-php-serialize.workspace = true
speedyspec-wp-hooks.workspace = true
speedyspec-wp-hooks-contracts.workspace = true
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-posts = { path = "../speedyspec-wp-posts" }
speedyspec-wp-posts-contracts.workspace = true
speedyspec-wp-posts-memory = { path = "../speedyspec-wp-posts-memory" }
speedyspec-wp-text-contracts.workspace = true
speedyspec-wp-text-escape = { path = "../speedyspec-wp-text-escape" }
speedyspec-wp-text-memory = { path = "../speedyspec-wp-text-memory" }
serde_json = "1"
