[package]
name = "speedyspec-router-php"
version = "0.2.0"
publish = false
description = "The route table store as a container port PHP may supply, and its PHP adapter."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "http"
role = "php"

[dependencies]
speedyspec-container.workspace = true
speedyspec-container-php.workspace = true
speedyspec-php-ext.workspace = true
speedyspec-routing.workspace = true
speedyspec-router-store-memory = { path = "../speedyspec-router-store-memory" }

[dev-dependencies]
speedyspec-php.workspace = true
speedyspec-hooks-memory.workspace = true
speedyspec-http.workspace = true

[[test]]
name = "php"
harness = false
