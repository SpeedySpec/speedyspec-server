[package]
name = "speedyspec-data-query"
version = "0.2.0"
publish = false
description = "SQL parsing, the query builder with partials, rewrite passes and the engine registry for speedyspec's data layer."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "data"
role = "implementation"

[dependencies]
speedyspec-data = { path = "../speedyspec-data" }
sqlparser = { version = "0.64", features = ["visitor"] }
indexmap = "2"
