[package]
name = "speedyspec-wp-text-escape"
version = "0.1.1"
description = "WordPress's escaping functions (esc_html, esc_attr, _wp_specialchars and the rest) in Rust, byte for byte, with PHP's own htmlspecialchars underneath."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aho-corasick = "1"
memchr = "2.8"
speedyspec-hooks = { path = "../speedyspec-hooks" }
speedyspec-wp-kses-contracts = { path = "../speedyspec-wp-kses-contracts" }
speedyspec-wp-kses-lexical = { path = "../speedyspec-wp-kses-lexical" }
speedyspec-wp-utf8 = { path = "../speedyspec-wp-utf8" }

[dev-dependencies]
speedyspec-wp-text-corpus = { path = "../speedyspec-wp-text-corpus", features = ["values"] }
