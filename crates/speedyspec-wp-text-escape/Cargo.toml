[package]
name = "speedyspec-wp-text-escape"
version = "0.6.0"
publish = false
description = "WordPress's escaping functions (esc_html, esc_attr, _wp_specialchars and the rest) in Rust, byte for byte, with PHP's own htmlspecialchars underneath."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
speedyspec-container = { path = "../speedyspec-container" }
speedyspec-cqrs = { path = "../speedyspec-cqrs" }
aho-corasick = "1"
memchr = "2.8"
speedyspec-hooks = { path = "../speedyspec-hooks" }
speedyspec-wp-kses-contracts = { path = "../speedyspec-wp-kses-contracts" }
speedyspec-wp-kses-lexical = { path = "../speedyspec-wp-kses-lexical" }
speedyspec-wp-utf8 = { path = "../speedyspec-wp-utf8" }
speedyspec-wp-hooks = { path = "../speedyspec-wp-hooks" }
speedyspec-wp-text-contracts = { path = "../speedyspec-wp-text-contracts" }
speedyspec-wp-hooks-contracts = { path = "../speedyspec-wp-hooks-contracts" }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
libc = "0.2"
speedyspec-wp-hooks-memory = { path = "../speedyspec-wp-hooks-memory" }
speedyspec-wp-text-memory = { path = "../speedyspec-wp-text-memory" }
speedyspec-wp-text-corpus = { path = "../speedyspec-wp-text-corpus", features = ["values"] }

[[bench]]
name = "escape"
harness = false
