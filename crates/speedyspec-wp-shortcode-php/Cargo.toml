[package]
name = "speedyspec-wp-shortcode-php"
version = "0.1.3"
publish = false
description = "WordPress's shortcode functions in PHP, native over the Rust Shortcode API."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
speedyspec-container = { path = "../speedyspec-container" }
speedyspec-cqrs = { path = "../speedyspec-cqrs" }
speedyspec-hooks = { path = "../speedyspec-hooks" }
speedyspec-php = { path = "../speedyspec-php" }
speedyspec-compat = { path = "../speedyspec-compat" }
speedyspec-wp-hooks = { path = "../speedyspec-wp-hooks" }
speedyspec-wp-shortcode = { path = "../speedyspec-wp-shortcode" }
speedyspec-wp-shortcode-contracts = { path = "../speedyspec-wp-shortcode-contracts" }
speedyspec-wp-html-split = { path = "../speedyspec-wp-html-split" }
speedyspec-wp-kses-contracts = { path = "../speedyspec-wp-kses-contracts" }
speedyspec-wp-kses-lexical = { path = "../speedyspec-wp-kses-lexical" }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
speedyspec-container-php = { path = "../speedyspec-container-php" }
speedyspec-php-ext = { path = "../speedyspec-php-ext" }
ureq = "3"
speedyspec-hooks-memory = { path = "../speedyspec-hooks-memory" }
speedyspec-wp-hooks-memory = { path = "../speedyspec-wp-hooks-memory" }
speedyspec-wp-hooks-php = { path = "../speedyspec-wp-hooks-php" }
speedyspec-wp-kses-php = { path = "../speedyspec-wp-kses-php" }

[[test]]
name = "php"
harness = false

[[test]]
name = "compat"
harness = false

[[test]]
name = "wordpress"
harness = false
