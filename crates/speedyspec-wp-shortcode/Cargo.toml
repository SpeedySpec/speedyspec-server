[package]
name = "speedyspec-wp-shortcode"
version = "0.1.8"
publish = false
description = "WordPress's Shortcode API (shortcodes.php) in Rust: the API, the scanners, the attribute parsers and the filters."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "shortcode"
role = "implementation"

[dependencies]
speedyspec-container.workspace = true
speedyspec-cqrs.workspace = true
speedyspec-wp-hooks.workspace = true
speedyspec-wp-shortcode-contracts.workspace = true
indexmap = "2"
fancy-regex = "0.20"
aho-corasick = "1"
memchr = "2"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
speedyspec-wp-hooks-contracts.workspace = true

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-html-split.workspace = true
proptest = "1"

[[bench]]
name = "scan"
harness = false

[[bench]]
name = "atts"
harness = false

[[bench]]
name = "tokens"
harness = false

[[bench]]
name = "do_shortcode"
harness = false
