[package]
name = "speedyspec-hooks"
version = "0.1.1"
description = "Hook contract for speedyspec: the Hooks trait, the Value type and a backend conformance suite. No storage."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The tests read the repository's compat/ and tests/php, so they run in this repository only.
exclude = ["tests/"]

[features]
# Exposes `conformance`, the suite every backend must pass.
conformance = []

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
