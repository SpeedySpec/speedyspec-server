[package]
name = "speedyspec-server-presentation"
version = "0.2.0"
publish = false
description = "Salvo wiring for the SpeedySpec server: request normalization, routing by mount, the access gate and handlers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "server"
role = "root"

[dependencies]
arc-swap = "1"
bytes = "1"
http = "1"
ipnet = "2"
percent-encoding = "2"
salvo = { version = "1.2", default-features = false, features = ["server", "http1"] }
speedyspec-server-domain = { path = "../speedyspec-server-domain" }
speedyspec-server-gate = { path = "../speedyspec-server-gate" }
speedyspec-server-static = { path = "../speedyspec-server-static" }
tracing = "0.1"

[dev-dependencies]
salvo = { version = "1.2", default-features = false, features = ["server", "http1", "test"] }
speedyspec-server-infra-access-dev = { path = "../speedyspec-server-infra-access-dev" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
