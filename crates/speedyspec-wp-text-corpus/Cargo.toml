[package]
name = "speedyspec-wp-text-corpus"
version = "0.6.0"
publish = false
description = "The formatting corpus recorded from stock WordPress (compat/formatting), read with no PHP so each text crate can compare its output byte for byte; with the php feature, the tools that build the scenarios and time PHP."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "text"
role = "test"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
speedyspec-hooks-memory = { workspace = true, optional = true }
speedyspec-php = { workspace = true, optional = true }
speedyspec-hooks = { workspace = true, optional = true }
speedyspec-compat = { workspace = true, optional = true }
speedyspec-wp-text-memory = { path = "../speedyspec-wp-text-memory", optional = true }
speedyspec-wp-text-contracts = { workspace = true, optional = true }

[dev-dependencies]
criterion = "0.8"
speedyspec-wp-html-split.workspace = true

[features]
# Converting recorded values to and from the Hook API's, and recorded diagnostics, for crates that test PHP-shaped
# functions.
values = ["dep:speedyspec-hooks", "dep:speedyspec-wp-text-memory", "dep:speedyspec-wp-text-contracts"]
# The scenario generator and the PHP baseline, which need the embedded PHP.
php = ["dep:speedyspec-php", "dep:speedyspec-hooks-memory", "dep:speedyspec-hooks", "dep:speedyspec-compat"]

[[bin]]
name = "formatting-scenarios"
required-features = ["php"]

[[bin]]
name = "php-baseline"
required-features = ["php"]

[[bin]]
name = "php-tables"
required-features = ["php"]

[[bench]]
name = "html_split"
harness = false
