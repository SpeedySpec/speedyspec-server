[package]
name = "speedyspec-wp-text-corpus"
version = "0.1.2"
description = "The formatting corpus recorded from stock WordPress (compat/formatting), read with no PHP so each text crate can compare its output byte for byte; with the php feature, the tools that build the scenarios and time PHP."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
speedyspec-hooks-memory = { path = "../speedyspec-hooks-memory", optional = true }
speedyspec-php = { path = "../speedyspec-php", optional = true }
speedyspec-hooks = { path = "../speedyspec-hooks", optional = true }
speedyspec-compat = { path = "../speedyspec-compat", optional = true }

[features]
# The scenario generator and the PHP baseline, which need the embedded PHP.
php = ["dep:speedyspec-php", "dep:speedyspec-hooks-memory", "dep:speedyspec-hooks", "dep:speedyspec-compat"]

[[bin]]
name = "formatting-scenarios"
required-features = ["php"]

[[bin]]
name = "php-baseline"
required-features = ["php"]

[[bin]]
name = "php-tables"
required-features = ["php"]
