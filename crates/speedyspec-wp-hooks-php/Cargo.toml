[package]
name = "speedyspec-wp-hooks-php"
version = "0.1.6"
description = "WordPress's hook functions, WP_Hook and the hook globals in PHP, native over the Rust Hook API."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The tests read the repository's compat/ and tests/php, so they run in this repository only.
exclude = ["tests/"]

[dependencies]
speedyspec-compat = { path = "../speedyspec-compat", version = "0.6.0" }
speedyspec-container = { path = "../speedyspec-container", version = "0.1.2" }
speedyspec-cqrs = { path = "../speedyspec-cqrs", version = "0.1.2" }
speedyspec-php = { path = "../speedyspec-php", version = "0.5.0" }
speedyspec-php-ext = { path = "../speedyspec-php-ext", version = "0.1.4" }
speedyspec-wp-hooks = { path = "../speedyspec-wp-hooks", version = "0.1.2" }
speedyspec-wp-hooks-memory = { path = "../speedyspec-wp-hooks-memory", version = "0.1.2" }

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
speedyspec-container-php = { path = "../speedyspec-container-php" }
speedyspec-hooks-memory = { path = "../speedyspec-hooks-memory" }
ureq = "3"

[[test]]
name = "php"
harness = false

[[test]]
name = "php_store"
harness = false

[[test]]
name = "wordpress"
harness = false

[[test]]
name = "without_legacy"
harness = false
