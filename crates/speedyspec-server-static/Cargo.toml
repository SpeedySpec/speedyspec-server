[package]
name = "speedyspec-server-static"
version = "0.2.0"
publish = false
description = "Builds and serves an in-memory, pre-compressed static file set from a release."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "server"
role = "root"

[dependencies]
blake3 = "1"
brotli = "8"
bytes = "1"
flate2 = "1"
globset = "0.4"
http = "1"
mime_guess = "2"
percent-encoding = "2"
speedyspec-server-domain = { path = "../speedyspec-server-domain" }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
