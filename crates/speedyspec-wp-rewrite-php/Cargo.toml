[package]
name = "speedyspec-wp-rewrite-php"
version = "0.1.10"
publish = false
description = "WordPress's rewrite API (WP_Rewrite, WP_MatchesMapRegex, rewrite.php) in PHP over the Rust port."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "route"
role = "php"

[dependencies]
speedyspec-compat.workspace = true
speedyspec-container.workspace = true
speedyspec-cqrs.workspace = true
speedyspec-php.workspace = true
speedyspec-php-ext.workspace = true
speedyspec-router = { path = "../speedyspec-router" }
speedyspec-router-store-memory = { path = "../speedyspec-router-store-memory" }
speedyspec-router-php = { path = "../speedyspec-router-php" }
speedyspec-routing.workspace = true
speedyspec-wp-hooks.workspace = true
speedyspec-wp-rewrite = { path = "../speedyspec-wp-rewrite" }
speedyspec-wp-hooks-contracts.workspace = true

[dev-dependencies]
sha2 = "0.11"
ureq = "3"
serde_json = "1"
speedyspec-container-php.workspace = true
speedyspec-hooks-memory.workspace = true
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-hooks-php.workspace = true

[[test]]
name = "php"
harness = false

[[test]]
name = "compat"
harness = false

[[test]]
name = "wordpress"
harness = false
