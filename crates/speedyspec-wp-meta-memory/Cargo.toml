[package]
name = "speedyspec-wp-meta-memory"
version = "0.1.0"
publish = false
description = "An in-memory meta repository, for tests and for callers with no database."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "meta"
role = "adapter"

[dependencies]
speedyspec-wp-meta-contracts = { path = "../speedyspec-wp-meta-contracts" }

[dev-dependencies]
speedyspec-wp-meta-contracts = { path = "../speedyspec-wp-meta-contracts", features = ["conformance"] }
