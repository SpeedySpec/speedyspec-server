[package]
name = "speedyspec-wp-i18n-files"
version = "0.1.1"
publish = false
description = "WordPress translation file readers (MO, .l10n.php) and the standard file probe, as adapters of speedyspec-wp-i18n-contracts."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
foldhash = "0.2"
speedyspec-wp-i18n-contracts = { path = "../speedyspec-wp-i18n-contracts" }
speedyspec-wp-utf8 = { path = "../speedyspec-wp-utf8" }

[dev-dependencies]
md5 = { package = "md-5", version = "0.11.0" }
serde_json = "1"
