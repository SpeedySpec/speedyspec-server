[package]
name = "speedyspec-wp-theme-json"
version = "0.1.3"
publish = false
description = "WordPress's theme.json engine in Rust: migration, sanitizing, merging, presets, style nodes and stylesheets."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "theme"
role = "implementation"

[dependencies]
speedyspec-container = { path = "../speedyspec-container" }
speedyspec-cqrs = { path = "../speedyspec-cqrs" }
speedyspec-hooks = { path = "../speedyspec-hooks" }
speedyspec-wp-hooks = { path = "../speedyspec-wp-hooks" }
speedyspec-wp-theme-json-contracts = { path = "../speedyspec-wp-theme-json-contracts" }
indexmap = "2"
fancy-regex = "0.20"
speedyspec-wp-i18n = { path = "../speedyspec-wp-i18n" }
speedyspec-wp-hooks-contracts = { path = "../speedyspec-wp-hooks-contracts" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
speedyspec-wp-hooks-memory = { path = "../speedyspec-wp-hooks-memory" }
speedyspec-wp-kses = { path = "../speedyspec-wp-kses" }
speedyspec-wp-kses-contracts = { path = "../speedyspec-wp-kses-contracts" }
proptest = "1"
serde_json = "1"

[[bench]]
name = "stylesheet"
harness = false
