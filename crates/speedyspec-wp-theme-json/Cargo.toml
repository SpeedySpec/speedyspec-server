[package]
name = "speedyspec-wp-theme-json"
version = "0.1.3"
publish = false
description = "WordPress's theme.json engine in Rust: migration, sanitizing, merging, presets, style nodes and stylesheets."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "theme"
role = "implementation"

[dependencies]
speedyspec-container.workspace = true
speedyspec-cqrs.workspace = true
speedyspec-hooks.workspace = true
speedyspec-wp-hooks.workspace = true
speedyspec-wp-theme-json-contracts.workspace = true
indexmap = "2"
fancy-regex = "0.20"
speedyspec-wp-i18n = { path = "../speedyspec-wp-i18n" }
speedyspec-wp-hooks-contracts.workspace = true

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-kses = { path = "../speedyspec-wp-kses" }
speedyspec-wp-kses-contracts.workspace = true
proptest = "1"
serde_json = "1"

[[bench]]
name = "stylesheet"
harness = false
