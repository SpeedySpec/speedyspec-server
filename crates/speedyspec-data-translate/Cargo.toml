[package]
name = "speedyspec-data-translate"
version = "0.2.0"
publish = false
description = "MySQL-to-portable rewrite passes, MySQL type parsing and the MySQL schema catalogue, shared by the SQLite and PostgreSQL engines."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "data"
role = "implementation"

[dependencies]
speedyspec-data = { path = "../speedyspec-data" }
speedyspec-data-query = { path = "../speedyspec-data-query" }
sqlparser = { version = "0.64", features = ["visitor"] }

[features]
# The static introspector the tests and the engines' tests build schemas with.
testing = []
