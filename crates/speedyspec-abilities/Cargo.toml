[package]
name = "speedyspec-abilities"
version = "0.1.0"
publish = false
description = "The Abilities transport: default ability metadata from operation traits, and the Abilities server that runs WP_Ability::execute() in WordPress's hook order."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
speedyspec-abilities-contracts = { path = "../speedyspec-abilities-contracts" }
speedyspec-operation-contracts = { path = "../speedyspec-operation-contracts" }
speedyspec-transport-contracts = { path = "../speedyspec-transport-contracts" }

[dev-dependencies]
speedyspec-operation = { path = "../speedyspec-operation" }
