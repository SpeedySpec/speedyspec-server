[package]
name = "speedyspec-abilities"
version = "0.1.0"
publish = false
description = "The Abilities transport: default ability metadata from operation traits, and the Abilities server that runs WP_Ability::execute() in WordPress's hook order."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "ability"
role = "implementation"

[dependencies]
speedyspec-operation-dispatch = { path = "../speedyspec-operation-dispatch" }
speedyspec-abilities-contracts.workspace = true
speedyspec-operation-contracts.workspace = true
speedyspec-transport-contracts.workspace = true

[dev-dependencies]
speedyspec-container.workspace = true
speedyspec-operation = { path = "../speedyspec-operation" }
