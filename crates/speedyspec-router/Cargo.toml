[package]
name = "speedyspec-router"
version = "0.1.0"
description = "A Laravel-style router with FastRoute's matching ideas, and WordPress's rule sets, query templates and permastructs."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
speedyspec-http = { path = "../speedyspec-http" }
speedyspec-routing = { path = "../speedyspec-routing" }
regex = "1"
fancy-regex = "0.20.2"
sha2 = "0.10"

[dev-dependencies]
proptest = "1.12.0"
speedyspec-router-store-memory = { path = "../speedyspec-router-store-memory" }
