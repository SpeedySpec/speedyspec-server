[package]
name = "speedyspec-router"
version = "0.1.0"
publish = false
description = "A Laravel-style router with FastRoute's matching ideas, and WordPress's rule sets, query templates and permastructs."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "http"
role = "implementation"

[dependencies]
speedyspec-http.workspace = true
speedyspec-routing.workspace = true
regex = "1"
fancy-regex = "0.20.2"
sha2 = "0.11"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.12.0"
serde_json = "1"
speedyspec-router-store-memory = { path = "../speedyspec-router-store-memory" }

[[bench]]
name = "match"
harness = false
