[package]
name = "speedyspec-data-postgres"
version = "0.2.0"
publish = false
description = "The PostgreSQL engine: MySQL statements translated for PostgreSQL, answered with MySQL's results."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
indexmap = "2"
bytes = "1"
postgres = "0.19"
speedyspec-data = { path = "../speedyspec-data" }
speedyspec-data-query = { path = "../speedyspec-data-query" }
speedyspec-data-translate = { path = "../speedyspec-data-translate" }
sqlparser = { version = "0.64", features = ["visitor"] }

[dev-dependencies]
speedyspec-data-corpus = { path = "../speedyspec-data-corpus" }
sqlparser = { version = "0.64", features = ["visitor"] }
speedyspec-data-conformance = { path = "../speedyspec-data-conformance" }
bytes = "1"
postgres = "0.19"
speedyspec-data-translate = { path = "../speedyspec-data-translate", features = ["testing"] }
