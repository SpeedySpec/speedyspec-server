[package]
name = "speedyspec-wp-i18n"
version = "0.1.2"
publish = false
description = "WordPress's translations in Rust: translation files and their lookup index, plural forms, the translation controller, and the I18nApi facade over the Hook API."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
foldhash = "0.2"
indexmap = "2"
md5 = { package = "md-5", version = "0.11.0" }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "inline-more"] }
speedyspec-hooks = { path = "../speedyspec-hooks" }
speedyspec-wp-hooks = { path = "../speedyspec-wp-hooks" }
speedyspec-wp-i18n-contracts = { path = "../speedyspec-wp-i18n-contracts" }

[dev-dependencies]
serde_json = "1"
