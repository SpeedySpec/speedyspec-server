[package]
name = "speedyspec-wp-i18n"
version = "0.2.0"
publish = false
description = "WordPress's translations in Rust: translation files and their lookup index, plural forms, the translation controller, and the I18nApi facade over the Hook API."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "i18n"
role = "implementation"

[dependencies]
foldhash = "0.2"
indexmap = "2"
md5 = { package = "md-5", version = "0.11.0" }
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "inline-more"] }
speedyspec-hooks.workspace = true
speedyspec-wp-hooks.workspace = true
speedyspec-wp-i18n-contracts.workspace = true
speedyspec-wp-hooks-contracts.workspace = true

[dev-dependencies]
serde_json = "1"
