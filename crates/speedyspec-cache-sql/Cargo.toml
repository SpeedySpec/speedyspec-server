[package]
name = "speedyspec-cache-sql"
version = "0.3.0"
publish = false
description = "A Caching Store over any speedyspec SQL Store: one table of groups, keys, byte values and expiry."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "cache"
role = "adapter"

[dependencies]
sha2 = "0.10"
speedyspec-cache.workspace = true
speedyspec-data.workspace = true
speedyspec-data-query = { path = "../speedyspec-data-query" }

[dev-dependencies]
speedyspec-cache-conformance = { path = "../speedyspec-cache-conformance" }
speedyspec-data-mysql = { path = "../speedyspec-data-mysql" }
speedyspec-data-postgres = { path = "../speedyspec-data-postgres" }
speedyspec-data-sqlite = { path = "../speedyspec-data-sqlite" }
postgres = "0.19"
