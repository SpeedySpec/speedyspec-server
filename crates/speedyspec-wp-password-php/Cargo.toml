[package]
name = "speedyspec-wp-password-php"
version = "0.4.0"
publish = false
description = "WordPress's password functions (wp_hash_password, wp_check_password, wp_password_needs_rehash, wp_generate_password, wp_rand) as native PHP functions over container ports, libsodium and bcrypt."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "password"
role = "php"

[dependencies]
speedyspec-container.workspace = true
speedyspec-container-php.workspace = true
speedyspec-hooks.workspace = true
speedyspec-php.workspace = true
speedyspec-php-ext.workspace = true
speedyspec-wp-crypto = { path = "../speedyspec-wp-crypto" }
speedyspec-wp-crypto-contracts.workspace = true
speedyspec-wp-crypto-sodium = { path = "../speedyspec-wp-crypto-sodium" }
speedyspec-wp-hooks.workspace = true
speedyspec-wp-password = { path = "../speedyspec-wp-password" }
speedyspec-wp-password-bcrypt = { path = "../speedyspec-wp-password-bcrypt" }
speedyspec-wp-password-contracts.workspace = true
speedyspec-wp-hooks-contracts.workspace = true

[dev-dependencies]
speedyspec-compat.workspace = true
sha2 = "0.10"
ureq = "3"
speedyspec-hooks-memory.workspace = true
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-hooks-php.workspace = true
serde_json = "1"

[[test]]
name = "php"
harness = false

[[test]]
name = "wordpress"
harness = false
