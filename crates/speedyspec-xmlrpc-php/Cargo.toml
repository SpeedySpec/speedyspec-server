[package]
name = "speedyspec-xmlrpc-php"
version = "0.1.1"
publish = false
description = "The XML-RPC transport's PHP adapter: WordPress's XML-RPC hooks and login, XmlRpc::bind, and the wp_xmlrpc_server shim whose methods run as operations."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "xmlrpc"
role = "php"

[dependencies]
base64 = "0.22"
indexmap = "2"
speedyspec-container.workspace = true
speedyspec-http.workspace = true
speedyspec-http-message = { path = "../speedyspec-http-message" }
speedyspec-operation = { path = "../speedyspec-operation" }
speedyspec-operation-contracts.workspace = true
speedyspec-operation-dispatch = { path = "../speedyspec-operation-dispatch" }
speedyspec-operation-php = { path = "../speedyspec-operation-php" }
speedyspec-php.workspace = true
speedyspec-php-ext.workspace = true
speedyspec-transport = { path = "../speedyspec-transport" }
speedyspec-transport-contracts.workspace = true
speedyspec-xmlrpc = { path = "../speedyspec-xmlrpc" }
speedyspec-xmlrpc-contracts.workspace = true

[dev-dependencies]
serde_json = "1"
sha2 = "0.11"
ureq = "3"
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-hooks-php.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
speedyspec-compat.workspace = true
speedyspec-container-php.workspace = true
speedyspec-hooks-memory.workspace = true

[[test]]
name = "hooks"
harness = false

[[test]]
name = "facade"
harness = false

[[test]]
name = "legacy"
harness = false

[[test]]
name = "end_to_end"
harness = false

[[test]]
name = "wordpress"
harness = false
