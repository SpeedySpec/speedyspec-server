[package]
name = "speedyspec-compat"
version = "0.1.0"
description = "Recorded compatibility: run a catalogue of scenarios against WordPress's original code, record the results, and replay them against the Rust ports."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
speedyspec-hooks = { path = "../speedyspec-hooks" }
speedyspec-hooks-memory = { path = "../speedyspec-hooks-memory" }
speedyspec-php = { path = "../speedyspec-php" }
tar = "0.4"
tempfile = "3"
ureq = "3"
