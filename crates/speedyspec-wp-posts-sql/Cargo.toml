[package]
name = "speedyspec-wp-posts-sql"
version = "0.2.0"
publish = false
description = "wp_posts over the wpdb port: the post repository and its row mapper."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "query"
role = "adapter"

[dependencies]
speedyspec-php-serialize.workspace = true
speedyspec-data.workspace = true
speedyspec-wp-posts-contracts.workspace = true
speedyspec-wp-db-contracts.workspace = true

[dev-dependencies]
speedyspec-wp-posts = { path = "../speedyspec-wp-posts" }
serde_json = "1"
hex = "0.4"
indexmap = "2"
speedyspec-wp-posts-contracts = { workspace = true, features = ["conformance"] }
speedyspec-wp-db = { path = "../speedyspec-wp-db" }
speedyspec-data-query = { path = "../speedyspec-data-query" }
speedyspec-data-mysql = { path = "../speedyspec-data-mysql" }
speedyspec-data-postgres = { path = "../speedyspec-data-postgres" }
speedyspec-data-sqlite = { path = "../speedyspec-data-sqlite" }
postgres = "0.19"
speedyspec-wp-hooks.workspace = true
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-hooks-contracts.workspace = true
