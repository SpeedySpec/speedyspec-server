[package]
name = "speedyspec-wp-media-php"
version = "0.4.0"
description = "WordPress's audio and video metadata functions as native PHP functions over the media reader port."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[package.metadata.speedyspec]
seam = "media"
role = "php"

[dependencies]
speedyspec-compat.workspace = true
speedyspec-container.workspace = true
speedyspec-container-php.workspace = true
speedyspec-hooks.workspace = true
speedyspec-php.workspace = true
speedyspec-php-ext.workspace = true
speedyspec-wp-hooks.workspace = true
speedyspec-wp-media = { path = "../speedyspec-wp-media" }
speedyspec-wp-media-contracts.workspace = true
speedyspec-wp-hooks-contracts.workspace = true

[dev-dependencies]
tempfile = "3"
speedyspec-hooks-memory.workspace = true
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-hooks-php.workspace = true
speedyspec-wp-media = { path = "../speedyspec-wp-media" }
speedyspec-wp-media-ffmpeg = { path = "../speedyspec-wp-media-ffmpeg" }
speedyspec-wp-media-midi = { path = "../speedyspec-wp-media-midi" }
speedyspec-wp-media-testkit = { path = "../speedyspec-wp-media-testkit" }
serde_json = "1"
sha2 = "0.11"
ureq = "3"

[[test]]
name = "php"
harness = false

[[test]]
name = "wordpress"
harness = false

[[test]]
name = "mime"
harness = false
