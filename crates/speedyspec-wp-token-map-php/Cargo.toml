[package]
name = "speedyspec-wp-token-map-php"
version = "0.2.0"
publish = false
description = "WordPress's WP_Token_Map in PHP, with WordPress's HTML5 named character reference table answered natively by speedyspec-wp-token-map."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "html"
role = "php"

[dependencies]
speedyspec-compat.workspace = true
speedyspec-php.workspace = true
speedyspec-hooks.workspace = true
speedyspec-wp-token-map.workspace = true

[dev-dependencies]
speedyspec-container.workspace = true
speedyspec-hooks-memory.workspace = true
speedyspec-php-ext.workspace = true
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-hooks-php.workspace = true
serde_json = "1"
sha2 = "0.11"
ureq = "3"
speedyspec-wp-hooks-contracts.workspace = true

[[test]]
name = "php"
harness = false

[[test]]
name = "wordpress"
harness = false
