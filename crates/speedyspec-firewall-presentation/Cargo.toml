[package]
name = "speedyspec-firewall-presentation"
version = "0.1.5"
publish = false
description = "The firewall as a native request stage, its WordPress hook callbacks, and its composition root."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "firewall"
role = "adapter"

[dependencies]
speedyspec-cache.workspace = true
speedyspec-firewall = { path = "../speedyspec-firewall" }
speedyspec-firewall-app = { path = "../speedyspec-firewall-app" }
speedyspec-firewall-infra-cache = { path = "../speedyspec-firewall-infra-cache" }
speedyspec-firewall-infra-options = { path = "../speedyspec-firewall-infra-options" }
speedyspec-native-stage.workspace = true
speedyspec-wp-hooks.workspace = true
speedyspec-wp-options-contracts.workspace = true
speedyspec-wp-hooks-contracts.workspace = true

[dev-dependencies]
speedyspec-wp-options = { path = "../speedyspec-wp-options" }
speedyspec-cache-memory = { path = "../speedyspec-cache-memory" }
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-object-cache = { path = "../speedyspec-wp-object-cache" }
speedyspec-wp-options-memory = { path = "../speedyspec-wp-options-memory" }
