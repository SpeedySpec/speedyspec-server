[package]
name = "speedyspec-server-infra-minisign"
version = "0.2.0"
publish = false
description = "Minisign signature checks for SpeedySpec server releases."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "server"
role = "root"

[dependencies]
minisign-verify = "0.2"
speedyspec-server-domain = { path = "../speedyspec-server-domain" }

[dev-dependencies]
minisign = "0.10"
tempfile = "3"
