[package]
name = "speedyspec-php-runtime"
version = "1.5.0"
publish = false
description = "The SpeedySpec PHP runtime: embedded PHP serving FastCGI, with the Rust WordPress API."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "speedyspec-php-runtime"
path = "src/main.rs"

[package.metadata.speedyspec]
seam = "server"
role = "root"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
speedyspec-runtime-contract.workspace = true
speedyspec-fastcgi.workspace = true
speedyspec-php.workspace = true
speedyspec-php-ext.workspace = true
speedyspec-container.workspace = true
speedyspec-container-php.workspace = true
speedyspec-hooks.workspace = true
speedyspec-hooks-memory.workspace = true
speedyspec-wp-hooks.workspace = true
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-hooks-php.workspace = true
speedyspec-wp-crypto-contracts.workspace = true
speedyspec-wp-crypto-php = { path = "../speedyspec-wp-crypto-php" }
speedyspec-wp-crypto-sodium = { path = "../speedyspec-wp-crypto-sodium" }
# The pinned FFmpeg, reported in the manifest; plan 2 adds the media adapter over it.
speedyspec-ffmpeg-sys = { path = "../speedyspec-ffmpeg-sys" }
speedyspec-cache.workspace = true
speedyspec-cache-file = { path = "../speedyspec-cache-file" }
speedyspec-cache-memory = { path = "../speedyspec-cache-memory" }
speedyspec-data.workspace = true
speedyspec-data-file = { path = "../speedyspec-data-file" }
speedyspec-wp-media-contracts.workspace = true
speedyspec-wp-media-isolate = { path = "../speedyspec-wp-media-isolate" }
speedyspec-wp-media-php = { path = "../speedyspec-wp-media-php" }
speedyspec-wp-db = { path = "../speedyspec-wp-db" }
speedyspec-wp-db-php = { path = "../speedyspec-wp-db-php" }
speedyspec-data-mysql = { path = "../speedyspec-data-mysql" }
speedyspec-data-query = { path = "../speedyspec-data-query" }
speedyspec-wp-object-cache-php = { path = "../speedyspec-wp-object-cache-php" }
speedyspec-wp-meta-php = { path = "../speedyspec-wp-meta-php" }
speedyspec-wp-posts-php = { path = "../speedyspec-wp-posts-php" }
speedyspec-wp-options-php = { path = "../speedyspec-wp-options-php" }
speedyspec-wp-cron = { path = "../speedyspec-wp-cron" }
speedyspec-wp-cron-php = { path = "../speedyspec-wp-cron-php" }
speedyspec-wp-cron-contracts.workspace = true
speedyspec-wp-hooks-contracts.workspace = true
speedyspec-wp-posts = { path = "../speedyspec-wp-posts" }
speedyspec-wp-password-contracts.workspace = true
speedyspec-wp-password-php = { path = "../speedyspec-wp-password-php" }
speedyspec-wp-text-diff-contracts.workspace = true
speedyspec-wp-text-diff-php = { path = "../speedyspec-wp-text-diff-php" }

[dev-dependencies]
tempfile = "3"
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "macros", "net", "time"] }
