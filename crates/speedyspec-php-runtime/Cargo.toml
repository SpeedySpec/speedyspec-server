[package]
name = "speedyspec-php-runtime"
version = "1.2.0"
publish = false
description = "The SpeedySpec PHP runtime: embedded PHP serving FastCGI, with the Rust WordPress API."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "speedyspec-php-runtime"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
speedyspec-runtime-contract = { path = "../speedyspec-runtime-contract" }
speedyspec-fastcgi = { path = "../speedyspec-fastcgi" }
speedyspec-php = { path = "../speedyspec-php" }
speedyspec-php-ext = { path = "../speedyspec-php-ext" }
speedyspec-container = { path = "../speedyspec-container" }
speedyspec-container-php = { path = "../speedyspec-container-php" }
speedyspec-hooks = { path = "../speedyspec-hooks" }
speedyspec-hooks-memory = { path = "../speedyspec-hooks-memory" }
speedyspec-wp-hooks = { path = "../speedyspec-wp-hooks" }
speedyspec-wp-hooks-memory = { path = "../speedyspec-wp-hooks-memory" }
speedyspec-wp-hooks-php = { path = "../speedyspec-wp-hooks-php" }
speedyspec-wp-crypto-contracts = { path = "../speedyspec-wp-crypto-contracts" }
speedyspec-wp-crypto-php = { path = "../speedyspec-wp-crypto-php" }
speedyspec-wp-crypto-sodium = { path = "../speedyspec-wp-crypto-sodium" }
speedyspec-wp-db = { path = "../speedyspec-wp-db" }
speedyspec-wp-db-php = { path = "../speedyspec-wp-db-php" }
speedyspec-data-mysql = { path = "../speedyspec-data-mysql" }
speedyspec-data-query = { path = "../speedyspec-data-query" }
speedyspec-wp-object-cache-php = { path = "../speedyspec-wp-object-cache-php" }
speedyspec-wp-options-php = { path = "../speedyspec-wp-options-php" }
speedyspec-wp-cron-php = { path = "../speedyspec-wp-cron-php" }
speedyspec-wp-password-contracts = { path = "../speedyspec-wp-password-contracts" }
speedyspec-wp-password-php = { path = "../speedyspec-wp-password-php" }
speedyspec-wp-text-diff-contracts = { path = "../speedyspec-wp-text-diff-contracts" }
speedyspec-wp-text-diff-php = { path = "../speedyspec-wp-text-diff-php" }

[dev-dependencies]
tempfile = "3"
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "macros", "net", "time"] }
