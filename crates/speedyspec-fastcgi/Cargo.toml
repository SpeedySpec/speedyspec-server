[package]
name = "speedyspec-fastcgi"
version = "0.1.3"
publish = false
description = "FastCGI 1.0: records and name-value pairs, a blocking responder (the PHP worker's side) and an async client (the server's side), streaming in both directions with backpressure."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["net", "io-util", "sync", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
