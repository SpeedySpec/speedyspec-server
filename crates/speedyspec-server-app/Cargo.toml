[package]
name = "speedyspec-server-app"
version = "0.1.7"
publish = false
description = "Use cases of the SpeedySpec server: the compatibility check and, later, the release lifecycle."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
semver = "1"
sha2 = "0.10"
thiserror = "2"
speedyspec-server-domain = { path = "../speedyspec-server-domain" }
tracing = "0.1"

[dev-dependencies]
speedyspec-server-infra-fs = { path = "../speedyspec-server-infra-fs" }
speedyspec-server-infra-memory = { path = "../speedyspec-server-infra-memory" }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
