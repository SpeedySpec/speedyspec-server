[package]
name = "speedyspec-data-mysql"
version = "0.2.0"
publish = false
description = "The MySQL engine for speedyspec's data layer: SQL store, dialect, introspector and factory over the blocking mysql driver."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "data"
role = "adapter"

[dependencies]
speedyspec-data.workspace = true
speedyspec-data-query = { path = "../speedyspec-data-query" }
mysql = { version = "28", default-features = false, features = ["minimal-rust"] }

[dev-dependencies]
speedyspec-data-conformance = { path = "../speedyspec-data-conformance" }
