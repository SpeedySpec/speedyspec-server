[package]
name = "speedyspec-wp-object-cache-php"
version = "0.3.0"
publish = false
description = "WordPress's wp_cache_* functions and WP_Object_Cache in PHP, native over the Rust object cache."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "object-cache"
role = "php"

[dependencies]
speedyspec-cache.workspace = true
speedyspec-compat.workspace = true
speedyspec-container.workspace = true
speedyspec-cqrs.workspace = true
speedyspec-hooks.workspace = true
speedyspec-php.workspace = true
speedyspec-php-ext.workspace = true
speedyspec-php-serialize.workspace = true
speedyspec-wp-object-cache = { path = "../speedyspec-wp-object-cache" }
speedyspec-wp-object-cache-contracts.workspace = true

[dev-dependencies]
serde_json = "1"
sha2 = "0.11"
speedyspec-cache-memory = { path = "../speedyspec-cache-memory" }
speedyspec-container-php.workspace = true
speedyspec-hooks-memory.workspace = true
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-hooks-php.workspace = true
tempfile = "3"
ureq = "3"

[[test]]
name = "php"
harness = false

[[test]]
name = "php_persistent"
harness = false

[[test]]
name = "wordpress"
harness = false

[[test]]
name = "wordpress_multisite"
harness = false
