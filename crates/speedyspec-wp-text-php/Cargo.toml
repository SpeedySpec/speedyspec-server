[package]
name = "speedyspec-wp-text-php"
version = "0.1.8"
publish = false
description = "WordPress's formatting functions (wptexturize, esc_html, sanitize_title and the rest) as native PHP functions over the Rust text port."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "text"
role = "php"

[dependencies]
memchr = "2.8"
speedyspec-compat.workspace = true
speedyspec-container.workspace = true
speedyspec-cqrs.workspace = true
speedyspec-php.workspace = true
speedyspec-php-ext.workspace = true
speedyspec-wp-hooks.workspace = true
speedyspec-wp-hooks-php.workspace = true
speedyspec-wp-html-split.workspace = true
speedyspec-wp-kses = { path = "../speedyspec-wp-kses" }
speedyspec-wp-kses-contracts.workspace = true
speedyspec-wp-kses-php = { path = "../speedyspec-wp-kses-php" }
speedyspec-wp-shortcode-contracts.workspace = true
speedyspec-wp-text = { path = "../speedyspec-wp-text" }
speedyspec-wp-text-contracts.workspace = true
speedyspec-wp-text-escape = { path = "../speedyspec-wp-text-escape" }
speedyspec-wp-hooks-contracts.workspace = true

[dev-dependencies]
speedyspec-container-php.workspace = true
speedyspec-hooks-memory.workspace = true
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-text-corpus = { path = "../speedyspec-wp-text-corpus", features = ["values"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
ureq = "3"

[[test]]
name = "php"
harness = false

[[test]]
name = "release"

[[test]]
name = "compat"
harness = false

[[test]]
name = "wordpress"
harness = false

[[test]]
name = "bench_php"
harness = false
