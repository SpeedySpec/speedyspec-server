[package]
name = "speedyspec-wp-crypto-sodium"
version = "0.5.0"
publish = false
description = "The WordPress crypto ports over libsodium: the same libsodium.a the static PHP's ext-sodium links."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
speedyspec-wp-crypto-contracts = { path = "../speedyspec-wp-crypto-contracts" }
# Linked to the static PHP's own libsodium.a through SODIUM_LIB_DIR (.cargo/config.toml), never a copy of its own.
libsodium-sys-stable = "1.24"

[dev-dependencies]
speedyspec-wp-crypto = { path = "../speedyspec-wp-crypto" }
base64 = "0.22"
serde_json = "1"
speedyspec-php = { path = "../speedyspec-php" }
speedyspec-hooks = { path = "../speedyspec-hooks" }
speedyspec-hooks-memory = { path = "../speedyspec-hooks-memory" }

[[test]]
name = "with_php"
harness = false
