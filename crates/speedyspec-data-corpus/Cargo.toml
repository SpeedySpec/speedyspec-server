[package]
name = "speedyspec-data-corpus"
version = "0.2.1"
publish = false
description = "The SQL corpus: the statements WordPress and popular plugins send, by shape, and the check that every engine plans them."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "speedyspec-sql-corpus"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
speedyspec-compat = { path = "../speedyspec-compat" }
speedyspec-data = { path = "../speedyspec-data" }
speedyspec-data-query = { path = "../speedyspec-data-query" }
sqlparser = { version = "0.64", features = ["visitor"] }
