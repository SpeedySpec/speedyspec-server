[package]
name = "speedyspec-firewall-infra-options"
version = "0.1.4"
publish = false
description = "The firewall's settings, read through the ported options API."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "firewall"
role = "adapter"

[dependencies]
speedyspec-firewall = { path = "../speedyspec-firewall" }
speedyspec-wp-options = { path = "../speedyspec-wp-options" }

[dev-dependencies]
speedyspec-wp-hooks.workspace = true
speedyspec-wp-hooks-memory.workspace = true
speedyspec-wp-object-cache = { path = "../speedyspec-wp-object-cache" }
speedyspec-wp-options-memory = { path = "../speedyspec-wp-options-memory" }
speedyspec-wp-hooks-contracts.workspace = true
