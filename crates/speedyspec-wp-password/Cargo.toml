[package]
name = "speedyspec-wp-password"
version = "0.1.0"
publish = false
description = "WordPress's password rules: hashing (argon2id by default), the hash-format chain, needs-rehash, wp_rand and wp_generate_password."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
speedyspec-hooks = { path = "../speedyspec-hooks" }
speedyspec-wp-crypto = { path = "../speedyspec-wp-crypto" }
speedyspec-wp-crypto-contracts = { path = "../speedyspec-wp-crypto-contracts" }
speedyspec-wp-password-contracts = { path = "../speedyspec-wp-password-contracts" }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"

[dev-dependencies]
serde_json = "1"
