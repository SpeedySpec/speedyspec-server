[package]
name = "speedyspec-wp-password"
version = "0.3.0"
publish = false
description = "WordPress's password rules: hashing (argon2id by default), the hash-format chain, needs-rehash, wp_rand and wp_generate_password."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "password"
role = "implementation"

[dependencies]
speedyspec-hooks.workspace = true
speedyspec-wp-crypto = { path = "../speedyspec-wp-crypto" }
speedyspec-wp-crypto-contracts.workspace = true
speedyspec-wp-password-contracts.workspace = true
base64 = "0.22"
hmac = "0.13"
sha2 = "0.10"
subtle = "2"

[dev-dependencies]
# Pure Rust: lets the recorded bcrypt cases replay without PHP.
speedyspec-wp-password-bcrypt = { path = "../speedyspec-wp-password-bcrypt" }
serde_json = "1"
