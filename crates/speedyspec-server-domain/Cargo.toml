[package]
name = "speedyspec-server-domain"
version = "0.3.0"
publish = false
description = "Value types and contracts for the SpeedySpec server. No I/O."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.speedyspec]
seam = "server"
role = "root"

[dependencies]
http = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
