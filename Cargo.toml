[workspace]
resolver = "3"
members = ["crates/*", "vendor/pcre2-sys"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/SpeedySpec/speedyspec-server"

# The platform crates (SpeedySpec/speedyspec-platform), from crates.io. Members inherit them with `.workspace = true`.
[workspace.dependencies]
speedyspec-abilities-contracts = "0.2.0"
speedyspec-cache = "0.3.0"
speedyspec-compat = "0.11.0"
speedyspec-container = "0.2.0"
speedyspec-container-php = "0.2.0"
speedyspec-cqrs = "0.2.0"
speedyspec-data = "0.3.0"
speedyspec-fastcgi = "0.2.0"
speedyspec-hooks = "0.2.0"
speedyspec-hooks-memory = "0.2.0"
speedyspec-http = "0.2.0"
speedyspec-native-stage = "0.2.0"
speedyspec-operation-contracts = "0.2.0"
speedyspec-php = "0.8.0"
speedyspec-php-ext = "0.2.0"
speedyspec-php-port-macros = "0.2.0"
speedyspec-php-serialize = "0.3.0"
speedyspec-rest-contracts = "0.2.0"
speedyspec-routing = "0.2.0"
speedyspec-runtime-contract = "0.6.0"
speedyspec-transport-contracts = "0.2.0"
speedyspec-wp-cron-contracts = "0.5.0"
speedyspec-wp-crypto-contracts = "0.6.0"
speedyspec-wp-db-contracts = "0.2.0"
speedyspec-wp-hooks = "0.2.0"
speedyspec-wp-hooks-contracts = "0.2.0"
speedyspec-wp-hooks-memory = "0.2.0"
speedyspec-wp-hooks-php = "0.2.0"
speedyspec-wp-html-split = "0.2.0"
speedyspec-wp-html-syntax = "0.6.0"
speedyspec-wp-i18n-contracts = "0.2.0"
speedyspec-wp-kses-contracts = "0.6.0"
speedyspec-wp-kses-lexical = "0.6.0"
speedyspec-wp-media-contracts = "0.5.0"
speedyspec-wp-meta-contracts = "0.4.0"
speedyspec-wp-object-cache-contracts = "0.2.0"
speedyspec-wp-options-contracts = "0.1.0"
speedyspec-wp-password-contracts = "0.4.0"
speedyspec-wp-posts-contracts = "0.4.0"
speedyspec-wp-shortcode-contracts = "0.6.0"
speedyspec-wp-text-contracts = "0.6.0"
speedyspec-wp-text-diff = "0.3.0"
speedyspec-wp-text-diff-contracts = "0.3.0"
speedyspec-wp-theme-json-contracts = "0.2.0"
speedyspec-wp-token-map = "0.6.0"
speedyspec-wp-utf8 = "0.6.0"
speedyspec-xmlrpc-contracts = "0.2.0"

# Release binaries: no symbols, and optimized across crates.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

# The Rust patterns (speedyspec-wp-text) run on the static PHP's own PCRE2 version, built with every symbol
# renamed so it links into the same binary as PHP's copy. See vendor/pcre2-sys/README.md.
[patch.crates-io]
pcre2-sys = { path = "vendor/pcre2-sys" }

