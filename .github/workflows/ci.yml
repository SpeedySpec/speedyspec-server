name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: ${{ matrix.target }}
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features speedyspec-server/test-hooks --target ${{ matrix.target }}
      - run: test -z "$(cargo tree -i aws-lc-sys --target all 2>/dev/null)"

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      # A throwaway single-node cluster in a container on the runner; nothing else is contacted.
      - name: Start k3s
        run: scripts/k3s.sh up
      - name: Three replicas, the Lease, an admin switch and a server rollout
        env:
          SPEEDYSPEC_E2E_KUBECONFIG: ${{ github.workspace }}/.k3s/kubeconfig
        run: cargo test -p speedyspec-server --features test-hooks --test kubernetes_e2e -- --ignored --test-threads=1
      - name: Stop k3s
        if: always()
        run: scripts/k3s.sh down
