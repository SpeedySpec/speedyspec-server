name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: ${{ matrix.target }}
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      # Without the static PHP: the server builds without it, and holds none of it. Every crate that needs PHP, and the
      # server's own tests (which start the PHP runtime's workers), run in the php job.
      - run: cargo build -p speedyspec-server --features test-hooks --target ${{ matrix.target }}
      - run: scripts/check-no-php-in-server.sh
      - run: >-
          cargo test --workspace --target ${{ matrix.target }}
          --exclude speedyspec-server --exclude speedyspec-php-runtime
          --exclude speedyspec-php --exclude speedyspec-php-ext --exclude speedyspec-container-php
          --exclude speedyspec-cqrs-php --exclude speedyspec-compat --exclude speedyspec-wp-hooks-php
          --exclude speedyspec-wp-db-php --exclude speedyspec-wp-object-cache-php --exclude speedyspec-wp-options-php
          --exclude speedyspec-wp-text-diff-php --exclude speedyspec-wp-shortcode-php
          --exclude speedyspec-data-corpus --exclude speedyspec-data-sqlite --exclude speedyspec-data-postgres
          --exclude speedyspec-wp-utf8-php --exclude speedyspec-wp-i18n-php --exclude speedyspec-wp-token-map-php
          --exclude speedyspec-router-php --exclude speedyspec-wp-rewrite-php
          --exclude speedyspec-wp-kses-php --exclude speedyspec-wp-text-php --exclude speedyspec-wp-kses --exclude speedyspec-wp-kses-lexical
          --exclude speedyspec-wp-kses-testkit --exclude speedyspec-wp-html-syntax
          --exclude speedyspec-wp-crypto-sodium --exclude speedyspec-wp-crypto-php --exclude speedyspec-wp-password-php
          --exclude speedyspec-pcre2-link-test
      - run: test -z "$(cargo tree -i aws-lc-sys --target all 2>/dev/null)"

  # The static PHP (scripts/build-php.sh) and everything that embeds it, with PHP apps on.
  php:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-15
            run: ""
            platform: ""
            php-build: .php-build
          - name: linux-x86_64
            os: ubuntu-latest
            run: scripts/linux-php.sh
            platform: linux/amd64
            php-build: .php-build-linux
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            run: scripts/linux-php.sh
            platform: linux/arm64
            php-build: .php-build-linux-arm64
    name: php (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      # Which container platform scripts/linux-php.sh runs (Linux rows only).
      SPEEDYSPEC_LINUX_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        if: matrix.run == ''
        with:
          toolchain: "1.99"
      - name: Cache static PHP
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.php-build }}/spc
            ${{ matrix.php-build }}/buildroot
          key: php-${{ matrix.name }}-${{ hashFiles('crates/speedyspec-php/php-version', 'scripts/build-php.sh') }}
      - name: Build static PHP
        env:
          # Runners are throwaway, so spc may install missing build tools.
          SPEEDYSPEC_ALLOW_HOST_INSTALL: "1"
          # spc looks up source releases through the GitHub API; the read-only token avoids rate limits.
          GITHUB_TOKEN: ${{ github.token }}
        run: ${{ matrix.run }} scripts/build-php.sh
      # Every extension WordPress needs: a missing one fails here, by name.
      - name: Extensions
        run: ${{ matrix.run }} cargo test -p speedyspec-php --test extensions
      - name: Test with php
        run: ${{ matrix.run }} cargo test --workspace --features speedyspec-server/test-hooks

  # The crates published to crates.io (scripts/publish-crates.txt): the list is consistent with the workspace, and
  # every one of them packages. No static PHP: packaging does not build them (the php job does).
  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - name: Check the list
        run: |
          cargo metadata --format-version 1 --no-deps > "$RUNNER_TEMP/metadata.json"
          scripts/release-crates.sh check "$RUNNER_TEMP/metadata.json"
      - name: Package them
        run: |
          args=()
          for name in $(grep -v -e '^[[:space:]]*$' -e '^[[:space:]]*#' scripts/publish-crates.txt); do args+=(-p "$name"); done
          cargo publish --dry-run --no-verify --locked "${args[@]}"

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      # A throwaway single-node cluster in a container on the runner; nothing else is contacted.
      - name: Start k3s
        run: scripts/k3s.sh up
      - name: Three replicas, the Lease, an admin switch and a server rollout
        env:
          SPEEDYSPEC_E2E_KUBECONFIG: ${{ github.workspace }}/.k3s/kubeconfig
        run: cargo test -p speedyspec-server --features test-hooks --test kubernetes_e2e -- --ignored --test-threads=1
      - name: Stop k3s
        if: always()
        run: scripts/k3s.sh down
