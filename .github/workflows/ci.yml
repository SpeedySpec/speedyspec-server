name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The platform crates come from crates.io: nothing committed patches them (scripts/platform-local.sh is for local
      # work only).
      - run: bash scripts/tests/check-no-platform-patch.sh && scripts/check-no-platform-patch.sh
      - run: bash scripts/tests/platform-local.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          targets: ${{ matrix.target }}
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      # Without the static PHP: the server builds without it, and holds none of it. Every crate that needs PHP, and the
      # server's own tests (which start the PHP runtime's workers), run in the php job.
      - run: cargo build -p speedyspec-server --features test-hooks --target ${{ matrix.target }}
      - run: scripts/check-no-php-in-server.sh
      - run: scripts/tests/check-seams.sh
      - run: scripts/check-seams.sh
      - run: >-
          cargo test --workspace --target ${{ matrix.target }}
          --exclude speedyspec-server --exclude speedyspec-php-runtime
          --exclude speedyspec-cqrs-php
          --exclude speedyspec-wp-db-php --exclude speedyspec-wp-object-cache-php --exclude speedyspec-wp-options-php
          --exclude speedyspec-wp-meta-php
          --exclude speedyspec-wp-cron-php
          --exclude speedyspec-wp-text-diff-php --exclude speedyspec-wp-shortcode-php
          --exclude speedyspec-data-corpus --exclude speedyspec-data-sqlite --exclude speedyspec-data-postgres
          --exclude speedyspec-wp-utf8-php --exclude speedyspec-wp-i18n-php --exclude speedyspec-wp-token-map-php
          --exclude speedyspec-router-php --exclude speedyspec-wp-rewrite-php
          --exclude speedyspec-wp-kses-php --exclude speedyspec-wp-text-php --exclude speedyspec-wp-kses
          --exclude speedyspec-wp-kses-testkit
          --exclude speedyspec-wp-crypto-sodium --exclude speedyspec-wp-crypto-php --exclude speedyspec-wp-password-php
          --exclude speedyspec-operation-php --exclude speedyspec-rest-php --exclude speedyspec-xmlrpc-php --exclude speedyspec-abilities-php --exclude speedyspec-wp-theme-json-php
          --exclude speedyspec-pcre2-link-test --exclude speedyspec-ffmpeg-sys
          --exclude speedyspec-wp-media-ffmpeg --exclude speedyspec-wp-media-isolate --exclude speedyspec-wp-media-corpus
          --exclude speedyspec-wp-media-php
      - run: test -z "$(cargo tree -i aws-lc-sys --target all 2>/dev/null)"

  # The static PHP (scripts/build-php.sh) and everything that embeds it, with PHP apps on.
  php:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-15
            run: ""
            platform: ""
            php-build: .php-build
          - name: linux-x86_64
            os: ubuntu-latest
            run: scripts/linux-php.sh
            platform: linux/amd64
            php-build: .php-build-linux
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            run: scripts/linux-php.sh
            platform: linux/arm64
            php-build: .php-build-linux-arm64
    name: php (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      # Which container platform scripts/linux-php.sh runs (Linux rows only).
      SPEEDYSPEC_LINUX_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        if: matrix.run == ''
        with:
          toolchain: "1.99"
      # The PHP version speedyspec-php pins, from the crate Cargo resolved: the caches are keyed on it.
      - name: PHP version
        id: phpver
        run: |
          v="$(${{ matrix.run }} scripts/php-version.sh)"
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: Cache static PHP
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.php-build }}/spc
            ${{ matrix.php-build }}/buildroot
          key: php-${{ matrix.name }}-${{ steps.phpver.outputs.v }}-${{ hashFiles('scripts/build-php.sh') }}
      - name: Cache static FFmpeg
        uses: actions/cache@v4
        with:
          path: ${{ matrix.php-build }}/ffmpeg/prefix
          key: ffmpeg-${{ matrix.name }}-${{ steps.phpver.outputs.v }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/build-php.sh') }}
      - name: Build static PHP
        env:
          # Runners are throwaway, so spc may install missing build tools.
          SPEEDYSPEC_ALLOW_HOST_INSTALL: "1"
          # spc looks up source releases through the GitHub API; the read-only token avoids rate limits.
          GITHUB_TOKEN: ${{ github.token }}
        run: ${{ matrix.run }} scripts/build-php.sh
      # The pinned, LGPL-only FFmpeg: licence, formats, no protocols, the pinned version.
      - name: FFmpeg
        run: ${{ matrix.run }} cargo test -p speedyspec-ffmpeg-sys
      # The media readers over FFmpeg, the probe child (with its test-only simulations) and the cache.
      - name: Media
        run: >-
          ${{ matrix.run }} cargo test -p speedyspec-wp-media-ffmpeg -p speedyspec-wp-media-isolate -p speedyspec-wp-media-corpus
          -p speedyspec-wp-media-php
          --features speedyspec-wp-media-isolate/test-modes
      - name: Test with php
        run: ${{ matrix.run }} cargo test --workspace --features speedyspec-server/test-hooks

  # The tests that need MySQL (they print "skip" elsewhere). Linux x86_64 only: GitHub's service containers run
  # there, and scripts/linux-php.sh joins the host network when SPEEDYSPEC_TEST_MYSQL_URL is set.
  mysql:
    name: mysql (linux-x86_64)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: speedyspec_test
        ports:
          - 33306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SPEEDYSPEC_LINUX_PLATFORM: linux/amd64
      SPEEDYSPEC_TEST_MYSQL_URL: mysql://root:password@127.0.0.1:33306/speedyspec_test
    steps:
      - uses: actions/checkout@v4
      - name: PHP version
        id: phpver
        run: |
          v="$(scripts/linux-php.sh scripts/php-version.sh)"
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: Cache static PHP
        uses: actions/cache@v4
        with:
          path: |
            .php-build-linux/spc
            .php-build-linux/buildroot
          key: php-linux-x86_64-${{ steps.phpver.outputs.v }}-${{ hashFiles('scripts/build-php.sh') }}
      - name: Cache static FFmpeg
        uses: actions/cache@v4
        with:
          path: .php-build-linux/ffmpeg/prefix
          key: ffmpeg-linux-x86_64-${{ steps.phpver.outputs.v }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/build-php.sh') }}
      - name: Build static PHP
        env:
          SPEEDYSPEC_ALLOW_HOST_INSTALL: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/linux-php.sh scripts/build-php.sh
      - name: Test with MySQL
        run: |
          scripts/linux-php.sh cargo test -p speedyspec-php-runtime --test database --test cron_run_once --test worker
          scripts/linux-php.sh cargo test -p speedyspec-wp-options-sql --test conditional_mysql
          scripts/linux-php.sh cargo test -p speedyspec-wp-meta-sql --test engines
          # Each makes its own database beside speedyspec_test (<db>_metadata for the replay, <db>_metadata_php for
          # the PHP tests), so they never empty the tables another test uses.
          scripts/linux-php.sh cargo test -p speedyspec-wp-meta-php --test compat --test errors --test replacement --test wordpress
          scripts/linux-php.sh cargo test -p speedyspec-wp-options-tests --test conditional
          scripts/linux-php.sh cargo test -p speedyspec-wp-cron -p speedyspec-wp-cron-options -p speedyspec-wp-cron-php

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      # A throwaway single-node cluster in a container on the runner; nothing else is contacted.
      - name: Start k3s
        run: scripts/k3s.sh up
      - name: Three replicas, the Lease, an admin switch and a server rollout
        env:
          SPEEDYSPEC_E2E_KUBECONFIG: ${{ github.workspace }}/.k3s/kubeconfig
        run: cargo test -p speedyspec-server --features test-hooks --test kubernetes_e2e -- --ignored --test-threads=1
      - name: Stop k3s
        if: always()
        run: scripts/k3s.sh down
