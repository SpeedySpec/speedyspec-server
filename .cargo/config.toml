# speedyspec-php links the static PHP at SPEEDYSPEC_PHP_PREFIX (it has no default), and ext-php-rs's build script
# finds PHP through PHP and PHP_CONFIG before it looks on PATH. Point all of them at the static build so the system
# PHP is never used. A variable already set in the environment wins (scripts/linux-php.sh and CI rely on the
# defaults; set SPEEDYSPEC_PHP_PREFIX, PHP, PHP_CONFIG and SODIUM_LIB_DIR together if you move the build).
[env]
SPEEDYSPEC_PHP_PREFIX = { value = ".php-build/buildroot", relative = true }
PHP = { value = ".php-build/buildroot/bin/php", relative = true }
PHP_CONFIG = { value = ".php-build/buildroot/bin/php-config", relative = true }
# The oldest macOS the binary runs on: what the static PHP is built for too
# (scripts/build-php.sh), so nothing linked in demands a newer one. Ignored off macOS.
MACOSX_DEPLOYMENT_TARGET = "12.0"
# libsodium-sys-stable (speedyspec-wp-crypto-sodium) links the static PHP's own libsodium.a, so Rust and ext-sodium
# share one libsodium at the version scripts/build-php.sh pins, and the crate never builds or downloads a copy.
SODIUM_LIB_DIR = { value = ".php-build/buildroot/lib", relative = true }
# speedyspec-ffmpeg-sys links the static FFmpeg scripts/build-ffmpeg.sh builds (build-php.sh runs it), with the static
# PHP's own libz.a, so PHP and FFmpeg share one zlib. Move it together with the variables above.
FFMPEG_PREFIX = { value = ".php-build/ffmpeg/prefix", relative = true }
